<style>/* required styles */

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {

/* general toolbar styles */

.leaflet-bar {

.leaflet-bar a {

.leaflet-popup {

}

.leaflet-tooltip-top:before {

<style>
:root{
  --bg:#020617;--panel:#0b1324;--panel2:#111b30;--panel3:#16223b;--garis:#1e2a44;--garis2:#2a3a5c;

  --tinggiKepala:56px;--tinggiNav:0px;--aman-bawah:env(safe-area-inset-bottom,0px);

.redup{color:var(--redup)}.kecilTeks{font-size:12px}
.sembunyi{display:none!important}

  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tbl:hover{border-color:var(--aksen)}

.tbl:disabled{opacity:.45;cursor:not-allowed}
.tbl.utama{background:linear-gradient(135deg,var(--aksen),#0891b2);border-color:transparent;color:#00141a}
.tbl.bahaya{background:#3b0d12;border-color:#7f1d1d;color:#fecaca}
.tbl.hijau{background:#052e22;border-color:#065f46;color:#a7f3d0}

.petunjuk{font-size:12px;color:var(--redup2);margin-top:3px}
.pil{display:inline-flex;flex-wrap:wrap;gap:6px}
.pil button{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--garis2);background:var(--panel2);cursor:pointer;font-size:12px;font-weight:600}
.pil button.aktif{background:#062a33;border-color:var(--aksen);color:var(--aksen2)}
@media (pointer:coarse){.pil button{min-height:42px}}
.lencana{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--garis2);background:var(--panel3);white-space:nowrap}
.lencana.hijau{color:#6ee7b7;border-color:#065f46;background:#052e22}
.lencana.kuning{color:#fcd34d;border-color:#78350f;background:#2b1a05}
.lencana.merah{color:#fca5a5;border-color:#7f1d1d;background:#2a0a0d}
.lencana.biru{color:#93c5fd;border-color:#1e3a8a;background:#0b1739}
.lencana.aksen{color:var(--aksen2);border-color:#155e75;background:#062a33}
.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:14px}
.kartu+.kartu{margin-top:12px}
.stat{background:var(--panel2);border:1px solid var(--garis);border-radius:var(--r2);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:20px;font-family:var(--mono);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:11px;color:var(--redup);text-transform:uppercase;letter-spacing:.05em}
.stat small{display:block;font-size:11px;color:var(--redup2);margin-top:2px}
table.tabel{width:100%;border-collapse:collapse;font-size:13px}
.tabel th,.tabel td{padding:8px 8px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:top}
.tabel th{font-size:11px;color:var(--redup);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel)}
.tabel tr.klik{cursor:pointer}.tabel tr.klik:hover td{background:var(--panel2)}
.gulirX{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.kosong{padding:24px;text-align:center;color:var(--redup)}
.peringatanKotak{border:1px solid #78350f;background:#1f1404;color:#fde68a;border-radius:var(--r2);padding:10px 12px;font-size:13px}
.galatKotak{border:1px solid #7f1d1d;background:#200a0c;color:#fecaca;border-radius:var(--r2);padding:10px 12px;font-size:13px}
.infoKotak{border:1px solid #155e75;background:#04202a;color:#a5f3fc;border-radius:var(--r2);padding:10px 12px;font-size:13px}

/* ---------- kerangka ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#kepala{height:var(--tinggiKepala);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;
  background:linear-gradient(180deg,#071026,#050b1a);border-bottom:1px solid var(--garis);padding-top:env(safe-area-inset-top,0)}
#logo{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,var(--aksen),#10b981);color:#00141a;font-weight:900;font-size:15px}
#logo img{width:100%;height:100%;object-fit:cover}
#judulBox{min-width:0;flex:1 1 auto}
#judulApp{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subjudulApp{font-size:11px;color:var(--redup);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chipStatus{display:flex;gap:6px;align-items:center}
#tblProfil{width:40px;height:40px;border-radius:50%;border:1px solid var(--garis2);background:var(--panel2);display:grid;place-items:center;
  font-weight:800;cursor:pointer;overflow:hidden;padding:0;flex:0 0 40px}
#tblProfil img{width:100%;height:100%;object-fit:cover}
@media (max-width:520px){#chipStatus .lencana.opsional{display:none}#subjudulApp{display:none}}
.gulirNav{position:relative;flex:0 0 auto}
#tabAtas{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:#050b1a;border-bottom:1px solid var(--garis);scrollbar-width:none}
#tabAtas::-webkit-scrollbar{display:none}
#tabAtas button{flex:0 0 auto;min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--redup);
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
#tabAtas button.aktif{color:var(--aksen2);background:#062a33;border-color:#155e75}
.panahGulir{position:absolute;top:0;bottom:0;width:40px;border:0;background:linear-gradient(90deg,#050b1a 40%,transparent);color:var(--aksen2);
  font-size:20px;cursor:pointer;z-index:5}
.panahGulir.kanan{right:0;background:linear-gradient(270deg,#050b1a 40%,transparent)}
.panahGulir.kiri{left:0}
#isi{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
.tab{position:absolute;inset:0;display:none}
.tab.tampil{display:block}
.tab.gulir{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(18px + var(--tinggiNav) + var(--aman-bawah));scroll-padding-bottom:calc(var(--tinggiNav) + 20px)}
.tab.gulir>.lebar{max-width:1180px;margin:0 auto}
.tab.penuh{overflow:hidden}
.subtab{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.subtab::-webkit-scrollbar{display:none}
.subtab button{flex:0 0 auto;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--garis2);background:var(--panel2);font-weight:700;font-size:12px;cursor:pointer}
.subtab button.aktif{border-color:var(--aksen);color:var(--aksen2);background:#062a33}
@media (pointer:coarse){.subtab button{min-height:44px}#tabAtas button{min-height:44px}}

/* nav bawah ponsel */
#navBawah{position:fixed;left:0;right:0;bottom:0;z-index:900;display:none;background:rgba(5,11,26,.97);border-top:1px solid var(--garis);
  padding:4px 4px calc(4px + var(--aman-bawah));backdrop-filter:blur(8px)}
#navBawah .isiNav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
#navBawah button{min-height:52px;border:0;background:transparent;color:var(--redup);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10.5px;font-weight:700;border-radius:12px;cursor:pointer;position:relative;padding:2px}
#navBawah button .ik{font-size:19px;line-height:1}
#navBawah button.aktif{color:var(--aksen2);background:#062a33}
#navBawah button .titik{position:absolute;top:6px;right:22%;width:7px;height:7px;border-radius:50%;background:var(--aksen2)}
#navBawah button span.lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.ponsel #navBawah{display:block}
body.ponsel #tabAtasWadah{display:none}

/* ---------- panel melayang di atas peta / 3D ---------- */
.panelApung{position:absolute;z-index:800;background:rgba(8,15,32,.94);border:1px solid var(--garis2);border-radius:var(--r);box-shadow:var(--bayang);
  backdrop-filter:blur(10px);max-height:calc(100% - 24px);overflow:auto;-webkit-overflow-scrolling:touch}
.panelApung .kepalaPanel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--garis);
  position:sticky;top:0;background:rgba(8,15,32,.98);z-index:2}
.panelApung .kepalaPanel b{font-size:13px}
.panelApung .isiPanel{padding:12px}
.panelKanan{top:12px;right:12px;width:340px}
.panelKiri{top:12px;left:62px;width:330px}
.panelBawahKiri{left:12px;bottom:12px;width:340px}
body.ponsel .tab.penuh{bottom:var(--tinggiNav)}
body.ponsel .panelApung.lembarBawah{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:auto!important;
  border-radius:16px 16px 0 0;max-height:58%;border-left:0;border-right:0}
.tombolApung{position:absolute;z-index:790;display:flex;flex-direction:column;gap:8px}
.tombolApung .tbl{box-shadow:var(--bayang);background:rgba(11,19,36,.95)}
.hud{position:absolute;z-index:780;left:50%;transform:translateX(-50%);bottom:10px;background:rgba(2,6,23,.82);border:1px solid var(--garis);
  border-radius:999px;padding:4px 12px;font:11px var(--mono);color:#a5f3fc;white-space:nowrap;pointer-events:none;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis}
body.ponsel .hud{display:none}
.hud:empty{display:none}
.cariPeta{position:absolute;z-index:795;top:10px;left:56px;right:64px;max-width:640px;display:flex;gap:6px;flex-wrap:wrap}
.cariPeta input{flex:1 1 180px;min-width:0;background:rgba(6,13,28,.95)}
.cariPeta .pil button{background:rgba(17,27,48,.95)}
.kanvas3d{position:absolute;inset:0;touch-action:none}
.kanvas3d canvas{display:block;width:100%;height:100%;outline:none}
.muat3d{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--redup)}

/* Leaflet: kontrol ramah sentuh (pemilih harus sama panjang dengan aturan .leaflet-touch milik Leaflet) */
.leaflet-container{background:#030712;font:inherit}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{width:40px;height:40px;line-height:40px;background:#0b1324;color:#e2e8f0;border-color:#1e2a44}
.leaflet-touch .leaflet-bar a:hover,.leaflet-bar a:hover{background:#111b30}
.leaflet-touch .leaflet-control-zoom-in,.leaflet-touch .leaflet-control-zoom-out{font-size:20px}
@media (pointer:coarse){.leaflet-touch .leaflet-bar a{width:44px;height:44px;line-height:44px}}
.leaflet-control-attribution{background:rgba(2,6,23,.75)!important;color:#94a3b8!important;font-size:10px!important}
.leaflet-control-attribution a{color:#67e8f9!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1324;color:#e2e8f0;border:1px solid #1e2a44}
.leaflet-popup-content{margin:12px 14px;font-size:13px;min-width:200px}
.label-blok{display:inline-block;color:#fff;font:700 11px var(--mono);text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000;white-space:nowrap;transform:translateX(-50%);pointer-events:none}
.ikonTitik{border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px rgba(0,0,0,.6)}
.denyut{animation:denyut 1.6s infinite}
@keyframes denyut{0%{box-shadow:0 0 0 0 rgba(34,211,238,.7)}70%{box-shadow:0 0 0 14px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}

/* ---------- modal & toast ---------- */
#tirai{position:fixed;inset:0;z-index:4000;background:rgba(1,4,12,.78);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#tirai.tampil{display:flex}
@media (min-width:700px){#tirai{align-items:center}}
#modal{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--garis2);
  border-radius:18px 18px 0 0;box-shadow:var(--bayang);padding-bottom:var(--aman-bawah)}
@media (min-width:700px){#modal{border-radius:18px;max-height:88vh}}
#modal.lebar{max-width:980px}
#modalKepala{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--garis)}
#modalKepala b{font-size:16px}
#modalIsi{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
#modalKaki{padding:12px 16px;border-top:1px solid var(--garis);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#modalKaki:empty{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--tinggiNav) + var(--aman-bawah));z-index:5000;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:min(92vw,480px)}
#toast div{background:#0b1324;border:1px solid var(--garis2);border-radius:12px;padding:10px 14px;box-shadow:var(--bayang);font-size:13px;pointer-events:auto;max-width:100%}
#toast div.galat{border-color:#7f1d1d;color:#fecaca}
#toast div.ok{border-color:#065f46;color:#a7f3d0}
#bilahLingkup{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#06102a;border-bottom:1px solid var(--garis);flex-wrap:wrap}
#bilahLingkup label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--redup);font-weight:700;min-width:0;flex:0 1 auto}
#bilahLingkup select{min-height:40px;padding:6px 30px 6px 10px;width:auto;max-width:280px;font-size:13px;font-weight:600;background-color:#0b1730}
#bilahLingkup .ringkas{font-size:12px;color:var(--redup);font-family:var(--mono);margin-left:auto;white-space:nowrap}
#bilahLingkup .tbl{min-height:40px}
@media (max-width:640px){#bilahLingkup{flex-wrap:nowrap;gap:6px;padding:6px 8px}#bilahLingkup label span{display:none}#bilahLingkup label{flex:1 1 0}#bilahLingkup select{max-width:none;width:100%}#bilahLingkup .ringkas{display:none}}
@media (pointer:coarse){#bilahLingkup select{min-height:44px}}
#spanduk{display:none;padding:7px 12px;font-size:12px;background:#2b1a05;border-bottom:1px solid #78350f;color:#fde68a}
#spanduk.tampil{display:block}
#spanduk.merah{background:#2a0a0d;border-color:#7f1d1d;color:#fecaca}

/* ---------- layar masuk ---------- */
#layarMasuk{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:16px;overflow:auto;
  background:radial-gradient(circle at 50% 0%,rgba(8,145,178,.25),transparent 60%),radial-gradient(circle at 100% 100%,rgba(16,185,129,.12),transparent 50%),var(--bg)}
#layarMasuk .kotakMasuk.kotakSetuju{max-width:680px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;padding:20px}
.naskahGulir{flex:1 1 auto;min-height:180px;max-height:52vh;overflow:auto;border:1px solid var(--garis);border-radius:var(--r2);padding:4px 14px 10px;background:rgba(5,11,24,.6);overscroll-behavior:contain}
.centangSetuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13px;line-height:1.45;cursor:pointer}
.centangSetuju input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--aksen)}
.naskahKartu{line-height:1.6;font-size:14px}.naskahKartu h4{margin:16px 0 6px;color:var(--aksen2)}
.naskahKartu ol.naskah{padding-left:22px}.naskahKartu ol.naskah li{margin-bottom:8px}.naskahKartu ul{padding-left:20px}
.naskahKartu .tabel td{vertical-align:top}.naskahBebas{border-left:3px solid var(--aksen);padding:6px 12px;background:var(--panel3);border-radius:0 8px 8px 0}
.isianKosong{color:#fcd34d;background:#2b1a05;border:1px dashed #78350f;border-radius:6px;padding:0 5px;font-size:.92em}
.rilis{border-top:1px solid var(--garis);padding:10px 0}.rilis ul{margin:6px 0 0;padding-left:20px}.rilis li{margin-bottom:4px}
@media (max-width:520px){#layarMasuk .kotakMasuk.kotakSetuju{padding:14px;border-radius:16px}.naskahGulir{max-height:46vh;padding:2px 10px 8px}.naskahKartu{font-size:13.5px}}
#layarMasuk .kotakMasuk{width:100%;max-width:420px;background:rgba(11,19,36,.92);border:1px solid #155e75;border-radius:22px;padding:24px;box-shadow:var(--bayang)}
#layarMasuk .logoBesar{width:64px;height:64px;border-radius:18px;margin:0 auto 10px;display:grid;place-items:center;font-size:26px;font-weight:900;
  background:linear-gradient(135deg,var(--aksen),#10b981);color:#00141a;overflow:hidden}
#layarMasuk .logoBesar img{width:100%;height:100%;object-fit:cover}
.kisiHolo{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(34,211,238,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.5) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%)}

/* ---------- grafik ---------- */
.grafik{width:100%;display:block}
.batang{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.batang .nama{flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--redup)}
.batang .jalur{flex:1;height:12px;border-radius:999px;background:#0b1730;overflow:hidden}
.batang .isiJalur{height:100%;border-radius:999px}
.batang .nilai{flex:0 0 auto;font-family:var(--mono);min-width:58px;text-align:right}
@media (max-width:420px){.batang .nama{flex-basis:84px}}

/* daftar */
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--garis)}
.item:last-child{border-bottom:0}
.item .utama{flex:1;min-width:0}
.item .utama b{display:block}
.legenda{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}
.legenda i{flex:0 0 14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.25)}
.legenda i.garis{height:4px;border-radius:2px}
.kotakWarna{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}

/* AR */
#arWadah{position:absolute;inset:0;background:#000;overflow:hidden}
#arWadah video,#arWadah canvas.arKanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arPenggaris{position:absolute;right:14px;top:12%;bottom:18%;width:44px;border-left:2px solid rgba(34,211,238,.8);pointer-events:none}
.arPenggaris div{position:absolute;left:0;font:10px var(--mono);color:#a5f3fc;border-top:1px solid rgba(34,211,238,.8);width:14px;padding-left:16px;white-space:nowrap}

@media print{body{overflow:visible}#app,#tirai,#toast{display:none!important}#cetakWadah{display:block!important}}

</div>

<div id="cetakWadah"></div>
<script>/* @preserve

var VERSI_KLIEN = '1.1.0';
/** Kode bangun (tanggal + sidik isi) diisi build.py. */
var BANGUN_KLIEN = '20261006.626be33';
var CDN_THREE = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
var KUNCI = { token: 'sgh_token', boot: 'sgh_boot', antrian: 'sgh_antrian', konflik: 'sgh_konflik', gps: 'sgh_gps_antrian',

  mode: 'demo', token: null, saya: null, data: null, pengaturan: {}, lisensi: null, peran: {},

// ------------------------------------------------------------------ utilitas
function $(sel, akar) { return (akar || document).querySelector(sel); }

}
function rupiah(n) { return isFinite(Number(n)) ? 'Rp ' + Math.round(Number(n)).toLocaleString('id-ID') : '–'; }

function haTeks(n) { return angka(n, 2) + ' ha'; }
function tgl(s) {
  if (!s) return '–';
  var d = new Date(String(s).length === 10 ? s + 'T00:00:00' : s);
  if (isNaN(d)) return esc(s);
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
}
function waktuTeks(s) {
  if (!s) return '–';
  var d = new Date(s);
  if (isNaN(d)) return esc(s);
  return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function relatif(s) {
  if (!s) return 'belum pernah';
  var dt = (Date.now() - new Date(s).getTime()) / 1000;
  if (dt < 60) return 'baru saja';
  if (dt < 3600) return Math.round(dt / 60) + ' mnt lalu';
  if (dt < 86400) return Math.round(dt / 3600) + ' jam lalu';
  return Math.round(dt / 86400) + ' hari lalu';
}
function hariIni() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function warnaSah(w, cadangan) { return /^#[0-9a-fA-F]{6}$/.test(String(w || '')) ? w : cadangan; }

// penyimpanan lokal yang tidak pernah melempar galat (mode privat / kuota penuh)
var Simpan = {
  ambil: function (k, bawaan) {
    try { var v = localStorage.getItem(k); return v === null ? bawaan : JSON.parse(v); } catch (e) { return bawaan; }

  taruh: function (k, v) {

// ------------------------------------------------------------------ izin & lisensi
function boleh(izin) { return !!(S.saya && S.saya.izin && S.saya.izin.indexOf(izin) >= 0); }
function lisensiAktif() { return !S.lisensi || S.lisensi.aktif; }
function fitur(nama) { return !S.lisensi || !S.lisensi.fitur || !!S.lisensi.fitur[nama]; }
function bolehUbah(izin) { return lisensiAktif() && boleh(izin); }
function modePembaca() { return !lisensiAktif(); }

// ------------------------------------------------------------------ panggilan peladen
function GalatPeladen(pesan, kode) { var e = new Error(pesan); e.kode = kode || 'GALAT'; return e; }

function tentukanMode() {
  if (window.google && google.script && google.script.run) return 'gas';
  var k = window.SAWITGIS_KONFIG || {};
  if (k.GAS_URL && /^https:\/\/script\.google\.com\//.test(k.GAS_URL)) return 'pwa';
  if (window.DEMO_PELADEN) return 'demo';
  return 'belum';

  var token = opsi.tanpaToken ? null : S.token;

      if (r.ok) return selesai(r.data);
      var e = GalatPeladen(r.galat || 'Galat tidak diketahui', r.kode);
      if (r.kode === 'SESI' && !opsi.diamSesi) sesiBerakhir(r.galat);

        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ aksi: aksi, data: data || {}, token: token })

        clearTimeout(batas);
        if (!res.ok) throw GalatPeladen('Peladen menjawab HTTP ' + res.status, 'JARINGAN');

  S.token = null;
  Simpan.hapus(KUNCI.token);
  if (typeof tampilkanMasuk === 'function') tampilkanMasuk(pesan || 'Sesi berakhir. Silakan masuk kembali.');

// ------------------------------------------------------------------ data lokal
function lembarKeKunci(nama) { return nama.charAt(0).toLowerCase() + nama.slice(1); }

  if (!S.data) return;
  var salinan = {};
  for (var k in S.data) salinan[k] = S.data[k];

    salinan.saya = Object.assign({}, salinan.saya, { fotoUrl: '' });
    Simpan.taruh(KUNCI.boot, salinan);
  }
}

function terapkanBoot(b) {
  S.data = b;
  S.saya = b.saya; S.pengaturan = b.pengaturan || {}; S.lisensi = b.lisensi; S.peran = b.peran || {};
  if (b.tahunIni) S.tahun = b.tahunIni;
  terapkanAntrianKeData();
  sahkanLingkup();
}

/** Daftar baris lembar (kunci klien) - sudah termasuk perubahan antrian luring. */

// ------------------------------------------------------------------ lingkup Perusahaan / Estate

  return panggil('sinkron', { antrian: kirim }).then(function (r) {
    var berhasil = 0, bentrok = 0, gagal = 0;
    r.hasil.forEach(function (h) {

        if (h.ok) Simpan.taruh(KUNCI.gps, Simpan.ambil(KUNCI.gps, []).slice(gpsAntri.length > 1000 ? 1000 : gpsAntri.length));

      else { gagal++; S.konflik.push({ butir: butir, galat: h.galat, kode: h.kode, waktu: new Date().toISOString() }); }

    simpanAntrian();
    if (!diam || berhasil || bentrok || gagal) {
      toast('Sinkron: ' + berhasil + ' terkirim' + (bentrok ? ', ' + bentrok + ' bentrok' : '') + (gagal ? ', ' + gagal + ' ditolak' : '') +

var _modal = { terbuka: false, diRiwayat: false, saatTutup: null, tutupTertunda: false, lanjut: null };

function modalBuka(judul, isiHtml, kakiHtml, opsi) {
  opsi = opsi || {};

  }

  var pertama = $('#modalIsi input:not([type=hidden]):not([readonly]), #modalIsi select, #modalIsi textarea');

function _tutupModalSungguhan() {
  if (!_modal.terbuka) return;
  _modal.terbuka = false;
  $('#tirai').classList.remove('tampil');
  $('#modalIsi').innerHTML = '';
  var fn = _modal.saatTutup; _modal.saatTutup = null;
  if (fn) try { fn(); } catch (e) { console.error(e); }
}

function modalTutup() {
  if (!_modal.terbuka) return;
  if (_modal.diRiwayat) { _modal.tutupTertunda = true; history.back(); }
  else _tutupModalSungguhan();
}

/** Tutup modal lalu jalankan fn SETELAH popstate selesai (history.back asinkron). */
function modalTutupLalu(fn) {
  if (!_modal.terbuka) { fn(); return; }
  _modal.lanjut = fn;
  modalTutup();
}

window.addEventListener('popstate', function () {
  if (_modal.terbuka || _modal.tutupTertunda) {
    _modal.diRiwayat = false;
    _modal.tutupTertunda = false;
    _tutupModalSungguhan();
    var l = _modal.lanjut; _modal.lanjut = null;
    if (l) setTimeout(l, 0);
    return;
  }
  if (typeof keluarLayarPenuh === 'function' && keluarLayarPenuh()) { history.pushState({ sgh: 'tab', tab: S.tab }, ''); return; }
  var st = history.state;
  if (st && st.sgh === 'tab' && st.tab) bukaTab(st.tab, st.subtab, { dariRiwayat: true });
});

/**
 * Bentuk formulir dari daftar ruas. Tipe: teks, angka, tanggal, pilih, centang, area, warna, info, sandi.
 * ruas: { k, label, t, opsi:[[nilai,label]], wajib, min, max, langkah, petunjuk, baca }
 */
function bentukRuas(ruas, nilai, awalan) {
  awalan = awalan || 'f_';
  nilai = nilai || {};
  return ruas.map(function (r) {
    var id = awalan + r.k;
    var v = nilai[r.k] !== undefined && nilai[r.k] !== null ? nilai[r.k] : (r.bawaan !== undefined ? r.bawaan : '');
    var atr = (r.wajib ? ' required' : '') + (r.baca ? ' readonly' : '') + ' enterkeyhint="go"';
    var petunjuk = r.petunjuk ? '<div class="petunjuk">' + r.petunjuk + '</div>' : '';
    var lebar = r.lebar ? ' style="grid-column:1/-1"' : '';
    if (r.t === 'info') return '<div class="ruas" id="' + id + '"' + lebar + '>' + (r.html || '') + '</div>';
    if (r.t === 'centang') {
      return '<label class="cek"' + lebar + '><input type="checkbox" id="' + id + '"' + (v === true || v === 'true' ? ' checked' : '') + (r.baca ? ' disabled' : '') + '> ' + esc(r.label) + '</label>' + petunjuk;
    }
    var masuk;
    if (r.t === 'pilih') {
      masuk = '<select id="' + id + '"' + atr + '>' + (r.kosong ? '<option value="">' + esc(r.kosong) + '</option>' : '') + (r.opsi || []).map(function (o) {
        var nv = Array.isArray(o) ? o[0] : o, nl = Array.isArray(o) ? o[1] : o;
        return '<option value="' + esc(nv) + '"' + (String(nv) === String(v) ? ' selected' : '') + '>' + esc(nl) + '</option>';
      }).join('') + '</select>';
    } else if (r.t === 'area') {
      masuk = '<textarea id="' + id + '"' + atr + (r.maks ? ' maxlength="' + r.maks + '"' : '') + '>' + esc(v) + '</textarea>';
    } else {
      var tipe = { angka: 'number', tanggal: 'date', sandi: 'password', surel: 'email', tel: 'tel', warna: 'text', url: 'url' }[r.t] || 'text';
      var ext = '';
      if (r.t === 'angka') ext = ' inputmode="decimal" step="' + (r.langkah || 'any') + '"' + (r.min !== undefined ? ' min="' + r.min + '"' : '') + (r.max !== undefined ? ' max="' + r.max + '"' : '');
      if (r.t === 'warna') ext = ' pattern="#[0-9a-fA-F]{6}" placeholder="#06b6d4"';
      if (r.t === 'sandi') ext = ' autocomplete="' + (r.ac || 'current-password') + '"';
      masuk = '<input type="' + tipe + '" id="' + id + '" value="' + esc(v) + '"' + atr + ext + (r.ph ? ' placeholder="' + esc(r.ph) + '"' : '') + '>';
    }
    return '<label class="ruas"' + lebar + '><span>' + esc(r.label) + (r.wajib ? ' *' : '') + '</span>' + masuk + petunjuk + '</label>';
  }).join('');
}

function ambilRuas(ruas, awalan) {
  awalan = awalan || 'f_';
  var o = {}, galat = null;
  ruas.forEach(function (r) {
    if (r.t === 'info' || galat) return;
    var el = document.getElementById(awalan + r.k);
    if (!el) return;
    var v;
    if (r.t === 'centang') v = el.checked;
    else if (r.t === 'angka') {
      v = el.value.trim() === '' ? null : Number(el.value.replace(',', '.'));
      if (v !== null && !isFinite(v)) galat = r.label + ' harus angka.';
      if (v !== null && r.min !== undefined && v < r.min) galat = r.label + ' minimal ' + r.min + '.';
      if (v !== null && r.max !== undefined && v > r.max) galat = r.label + ' maksimal ' + r.max + '.';
    } else v = el.value.trim();
    if (r.wajib && (v === '' || v === null)) galat = r.label + ' wajib diisi.';
    if (r.t === 'warna' && v && !/^#[0-9a-fA-F]{6}$/.test(v)) galat = r.label + ' harus heks 6 digit (#rrggbb).';
    o[r.k] = v;
  });
  if (galat) throw new Error(galat);
  return o;
}

/** Enter = kirim di seluruh aplikasi (papan ketik ponsel menampilkan tombol "Go"). */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.keyCode !== 13) return;
  if (e.isComposing || e.keyCode === 229) return;
  var el = e.target;
  if (!el || el.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
  if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
  if (/^(checkbox|radio|range|file|button|submit)$/.test(el.type)) return;
  var tujuan = el.dataset.enter ? document.getElementById(el.dataset.enter) : null;
  if (!tujuan && _modal.terbuka && $('#modal').contains(el)) tujuan = $('#modalKaki .tbl.utama') || $('#modalKaki .tbl.bahaya');
  if (!tujuan) { var f = el.closest('[data-kirim]'); if (f) tujuan = document.getElementById(f.dataset.kirim); }
  if (tujuan && !tujuan.disabled) { e.preventDefault(); tujuan.click(); }
});

/** Input file HARUS ditempel ke dokumen sebelum .click() - di WebView Android lama
 *  & Safari iOS klik pada elemen lepas tidak membuka pemilih sama sekali. */
function bukaPemilihBerkas(terima, opsi) {
  opsi = opsi || {};
  return new Promise(function (selesai) {
    var inp = document.createElement('input');
    inp.type = 'file';
    if (terima) inp.accept = terima;
    if (opsi.banyak) inp.multiple = true;
    if (opsi.kamera) inp.setAttribute('capture', 'environment');
    inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(inp);
    inp.onchange = function () {
      var f = Array.prototype.slice.call(inp.files || []);
      inp.remove();
      selesai(opsi.banyak ? f : f[0] || null);
    };
    inp.click();
  });
}

function bacaTeks(berkas) {
  return new Promise(function (ok, gagal) {
    var r = new FileReader();
    r.onload = function () { ok(r.result); };
    r.onerror = function () { gagal(new Error('Berkas tidak terbaca')); };
    r.readAsText(berkas);
  });
}
function bacaBuffer(berkas) {
  return new Promise(function (ok, gagal) {
    var r = new FileReader();
    r.onload = function () { ok(r.result); };
    r.onerror = function () { gagal(new Error('Berkas tidak terbaca')); };
    r.readAsArrayBuffer(berkas);
  });
}

/** Kecilkan gambar ke sisi terpanjang maks px & JPEG/PNG; target ukuran karakter. */
function kompresGambar(berkas, maks, targetKarakter, png) {
  maks = maks || 512; targetKarakter = targetKarakter || 120000;
  var dariBitmap = window.createImageBitmap ? createImageBitmap(berkas) : new Promise(function (ok, gagal) {
    var img = new Image(); var url = URL.createObjectURL(berkas);
    img.onload = function () { ok(img); }; img.onerror = function () { URL.revokeObjectURL(url); gagal(new Error('Bukan gambar yang sah')); };
    img.src = url;
  });
  return dariBitmap.then(function (img) {
    var w = img.width, h = img.height, s = Math.min(1, maks / Math.max(w, h));
    var hasil = '', mutu = 0.86, skala = s;
    for (var i = 0; i < 6; i++) {
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * skala)); c.height = Math.max(1, Math.round(h * skala));
      var ctx = c.getContext('2d');
      if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      hasil = png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', mutu);
      if (hasil.length <= targetKarakter) break;
      mutu = Math.max(0.5, mutu - 0.12); skala *= 0.82;
    }
    if (img.close) img.close();
    return hasil;
  });
}

function unduhTeks(isi, nama, mime) {
  var blob = isi instanceof Blob ? isi : new Blob([isi], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nama;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---- 05-geo.js ---- */
/* =====================================================================
 * 05-geo.js - geodesi, UTM, pembangkit pokok sawit, mesin tematik,
 *             model elevasi digital (DEM)
 * ===================================================================== */
var R_BUMI = 6378137;
var RAD = Math.PI / 180;

function jarakM(a, b) { // a,b = [lng, lat]
  var dLat = (b[1] - a[1]) * RAD, dLng = (b[0] - a[0]) * RAD;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R_BUMI * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function panjangGarisM(titik) { var s = 0; for (var i = 1; i < titik.length; i++) s += jarakM(titik[i - 1], titik[i]); return s; }
function luasCincinM2(cincin) {
  if (!cincin || cincin.length < 3) return 0;
  var t = 0, n = cincin.length;
  for (var i = 0; i < n; i++) {
    var p1 = cincin[i], p2 = cincin[(i + 1) % n];
    t += (p2[0] - p1[0]) * RAD * (2 + Math.sin(p1[1] * RAD) + Math.sin(p2[1] * RAD));
  }
  return Math.abs(t * R_BUMI * R_BUMI / 2);
}
function luasPoligonHa(batas) {
  if (!batas || !batas[0]) return 0;
  var a = luasCincinM2(batas[0]);
  for (var i = 1; i < batas.length; i++) a -= luasCincinM2(batas[i]);
  return a / 10000;
}
function dalamCincin(p, cincin) {
  var x = p[0], y = p[1], dalam = false;
  for (var i = 0, j = cincin.length - 1; i < cincin.length; j = i++) {
    var xi = cincin[i][0], yi = cincin[i][1], xj = cincin[j][0], yj = cincin[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) dalam = !dalam;
  }
  return dalam;
}
function dalamPoligon(p, batas) {
  if (!batas || !batas[0] || !dalamCincin(p, batas[0])) return false;
  for (var i = 1; i < batas.length; i++) if (dalamCincin(p, batas[i])) return false;
  return true;
}
function kotakBatas(titik) {
  var k = { minLng: Infinity, minLat: Infinity, maxLng: -Infinity, maxLat: -Infinity };
  titik.forEach(function (p) { if (p[0] < k.minLng) k.minLng = p[0]; if (p[0] > k.maxLng) k.maxLng = p[0]; if (p[1] < k.minLat) k.minLat = p[1]; if (p[1] > k.maxLat) k.maxLat = p[1]; });
  return k;
}
function blokDiTitik(lng, lat) {
  var b = blokAktif();
  for (var i = 0; i < b.length; i++) if (b[i].batas && dalamPoligon([lng, lat], b[i].batas)) return b[i];
  return null;
}
/** Jarak titik ke garis (meter, pendekatan planar lokal - akurat untuk skala kebun). */
function jarakKeGarisM(p, garis) {
  var best = Infinity, kx = 111320 * Math.cos(p[1] * RAD), ky = 110540;
  for (var i = 1; i < garis.length; i++) {
    var ax = (garis[i - 1][0] - p[0]) * kx, ay = (garis[i - 1][1] - p[1]) * ky;
    var bx = (garis[i][0] - p[0]) * kx, by = (garis[i][1] - p[1]) * ky;
    var dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    var t = L ? jepit(-(ax * dx + ay * dy) / L, 0, 1) : 0;
    var x = ax + t * dx, y = ay + t * dy;
    best = Math.min(best, Math.sqrt(x * x + y * y));
  }
  return best;
}

/** WGS84 -> UTM (Transverse Mercator, rumus Snyder). Versi asli memakai rumus linier
 *  "500000 + (lng-99)*111320" yang meleset ratusan meter dan zona dipatok 47N. */
function keUtm(lat, lng) {
  var zona = Math.floor((lng + 180) / 6) + 1;
  var lng0 = ((zona - 1) * 6 - 180 + 3) * RAD;
  var a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  var phi = lat * RAD, lam = lng * RAD;
  var N = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi));
  var T = Math.tan(phi) * Math.tan(phi), C = ep2 * Math.cos(phi) * Math.cos(phi), A = Math.cos(phi) * (lam - lng0);
  var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 * e2 * e2 / 1024) * Math.sin(2 * phi) +
    (15 * e2 * e2 / 256 + 45 * e2 * e2 * e2 / 1024) * Math.sin(4 * phi) - (35 * e2 * e2 * e2 / 3072) * Math.sin(6 * phi));
  var x = k0 * N * (A + (1 - T + C) * A * A * A / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
  var y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  var belahan = lat >= 0 ? 'N' : 'S';
  if (lat < 0) y += 10000000;
  return { zona: zona, belahan: belahan, x: x, y: y, teks: zona + belahan + ' ' + Math.round(x).toLocaleString('id-ID') + ' mT ' + Math.round(y).toLocaleString('id-ID') + ' mU' };
}

// ------------------------------------------------------------------ pokok sawit
function hashTeks(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }

var _cachePokok = {};
/**
 * Bangkitkan titik pokok pola segitiga dari SPH blok (jarak tanam d = sqrt(10000/(SPH*0,866))).
 * Status kesehatan: hasil sensus (lembar SensusPokok) bila ada, selain itu sebaran
 * deterministik sesuai ganodermaPct & NDVI blok - bukan dipatok "tiap pokok ke-35 blok A-001"
 * seperti versi asli yang membuat sebaran tidak cocok dengan angka infeksi blok.
 */
function pokokBlok(b, sensusPeta) {
  var kunciCache = b.id + '|' + b.diubah + '|' + (b.sph || 0) + '|' + (sensusPeta ? sensusPeta._v : '');
  if (_cachePokok[b.id] && _cachePokok[b.id].k === kunciCache) return _cachePokok[b.id].d;
  var hasil = [];
  if (!b.batas || !b.batas[0]) return hasil;
  var cincin = b.batas[0];
  var kb = kotakBatas(cincin);
  var sph = b.sph > 40 ? b.sph : 136;
  var d = Math.sqrt(10000 / (sph * 0.8660254));
  var latTengah = (kb.minLat + kb.maxLat) / 2;
  var dLat = (d * 0.8660254) / 110540, dLng = d / (111320 * Math.cos(latTengah * RAD));
  var umur = umurBlok(b) || 0;
  var pGano = (Number(b.ganodermaPct) || 0) / 100;
  var ndvi = b.ndvi === null || b.ndvi === undefined ? 0.8 : Number(b.ndvi);
  var pDef = Math.max(0, 0.74 - ndvi) * 0.35;
  var pMati = umur >= 25 ? 0.006 : 0.0015;
  var tinggi = Math.min(16, 1.5 + umur * 0.48);
  var baris = 0;
  for (var lat = kb.minLat + dLat / 2; lat < kb.maxLat; lat += dLat) {
    baris++;
    var geser = baris % 2 ? dLng / 2 : 0, kolom = 0;
    for (var lng = kb.minLng + dLng / 2 + geser; lng < kb.maxLng; lng += dLng) {
      kolom++;
      var p = [lng, lat];
      if (!dalamPoligon(p, b.batas)) continue;
      var nomor = b.kode + '-B' + ('0' + baris).slice(-2) + '-P' + ('0' + kolom).slice(-2);
      var st = 'Sehat';
      var sensus = sensusPeta && sensusPeta[nomor];
      if (sensus) st = sensus.status;
      else {
        var r = hashTeks(nomor);
        if (r < pMati) st = 'Mati';
        else if (r < pMati + pGano) st = 'Ganoderma';
        else if (r < pMati + pGano + pDef) st = 'Defisiensi_Hara';
      }
      hasil.push({ nomor: nomor, blokId: b.id, baris: baris, kolom: kolom, lng: lng, lat: lat, status: st, tinggiM: sensus && sensus.tinggiM ? sensus.tinggiM : tinggi,
        tahunTanam: b.tahunTanam, dariSensus: !!sensus });
    }
  }
  _cachePokok[b.id] = { k: kunciCache, d: hasil };
  return hasil;
}

  var valid = nilai.filter(function (v) { return v !== nd && isFinite(v); });
  var rata = valid.reduce(function (a, b) { return a + b; }, 0) / Math.max(1, valid.length);
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
    var sx = Math.min(kepala.ncols - 1, Math.round(x / (n - 1) * (kepala.ncols - 1)));
    var sy = Math.min(kepala.nrows - 1, Math.round(y / (n - 1) * (kepala.nrows - 1)));
    var v = nilai[sy * kepala.ncols + sx];
    if (v === nd || !isFinite(v)) v = rata;
    z[y * n + x] = v; if (v < min) min = v; if (v > max) max = v;
  }
  return { lebar: n, tinggi: n, kb: kb, z: z, min: min, max: max, sintetis: false, ukuranSelM: (kb.maxLng - kb.minLng) * 111320 / (n - 1) };
}

/* ---- 06-peta.js ---- */
/* =====================================================================
 * 06-peta.js - Peta 2D (Leaflet): peta dasar BYOK, blok tematik, infrastruktur,
 *              sensor & cuaca, GPS, pengukuran, inspektor blok
 * ===================================================================== */
var PETA = { peta: null, dasar: null, grup: {}, ukur: { mode: null, titik: [], lapis: null }, labelBlok: null, polBlok: {} };

PENANGAN_TAB.peta = {
  buka: function (w) {

    else { setTimeout(function () { PETA.peta.invalidateSize(); }, 30); gambarLapisan(); }
  },
  gambar: function () { if (PETA.peta) { aturPetaDasar(); gambarLapisan(); } },
  ubahUkuran: function () { if (PETA.peta) PETA.peta.invalidateSize(); },
  tutup: function () { }
};

function bangunPeta(w) {
  w.innerHTML = '<div id="petaLeaflet" style="position:absolute;inset:0"></div>' +
    '<div class="cariPeta" id="cariPeta"></div>' +
    '<div class="tombolApung" style="left:10px;top:104px" id="tombolPeta"></div>' +
    '<div class="hud" id="hudPeta">Gerakkan kursor di peta</div>';
  var pref = Simpan.ambil(KUNCI.pref, {});
  if (pref.peta) {
    ['simbologi', 'tematik', 'opasitas', 'dasar'].forEach(function (k) { if (pref.peta[k] !== undefined) S.peta[k] = pref.peta[k]; });
    if (pref.peta.lapisan) Object.assign(S.peta.lapisan, pref.peta.lapisan);
  }
  var k = kebunAktif();
  var m = L.map('petaLeaflet', { zoomControl: true, attributionControl: true, preferCanvas: true, maxZoom: 21, tap: false, worldCopyJump: false });
  PETA.peta = m;
  m.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  var titikAwal = titikBatasLingkup();
  if (titikAwal.length) m.fitBounds(L.latLngBounds(lintangBujur(titikAwal)), { padding: [20, 20] });
  else m.setView([k ? k.pusatLat : -2.5, k ? k.pusatLng : 117], k ? 14 : 5);
  PETA.sudahDipusatkan = true;
  ['dasarKisi', 'kebun', 'afdeling', 'sungai', 'sempadan', 'blok', 'label', 'jalan', 'kanal', 'bangunan', 'pintu', 'sensor', 'cuaca', 'radar', 'gps', 'ukur', 'pilih']
    .forEach(function (g) { PETA.grup[g] = L.layerGroup().addTo(m); });
  m.on('mousemove', function (e) {
    var u = keUtm(e.latlng.lat, e.latlng.lng);
    var b = blokDiTitik(e.latlng.lng, e.latlng.lat);
    $('#hudPeta').textContent = e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6) + '  •  UTM ' + u.teks + (b ? '  •  Blok ' + b.kode : '');
  });
  m.on('click', function (e) {
    if (PETA.ukur.mode) { tambahTitikUkur(e.latlng); return; }
    var b = blokDiTitik(e.latlng.lng, e.latlng.lat);
    if (b) pilihBlok(b.id); else tutupInspektor();
  });
  m.on('zoomend', function () { gambarSempadan(); aturLabel(); });
  aturPetaDasar();
  bangunBilahCari();
  bangunTombolPeta();
  gambarLapisan();
  if (typeof mulaiPollingGps === 'function') mulaiPollingGps();
}

function lintangBujur(cincin) { return cincin.map(function (p) { return [p[1], p[0]]; }); }
function simpanPrefPeta() {
  var p = Simpan.ambil(KUNCI.pref, {});
  p.peta = { simbologi: S.peta.simbologi, tematik: S.peta.tematik, opasitas: S.peta.opasitas, dasar: S.peta.dasar, lapisan: S.peta.lapisan };
  Simpan.taruh(KUNCI.pref, p);
}

// ------------------------------------------------------------------ peta dasar (BYOK)
/** Lapisan kisi lokal: digambar sendiri, tanpa unduhan, tanpa kewajiban lisensi pihak ketiga. */
var KisiLokal = L.GridLayer.extend({
  createTile: function (c) {
    var t = document.createElement('canvas'), s = this.getTileSize();
    t.width = s.x; t.height = s.y;
    var g = t.getContext('2d');
    g.fillStyle = '#04101f'; g.fillRect(0, 0, s.x, s.y);
    g.strokeStyle = 'rgba(34,211,238,0.10)'; g.lineWidth = 1;
    for (var i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * s.x / 4, 0); g.lineTo(i * s.x / 4, s.y); g.stroke(); g.beginPath(); g.moveTo(0, i * s.y / 4); g.lineTo(s.x, i * s.y / 4); g.stroke(); }
    g.strokeStyle = 'rgba(34,211,238,0.22)'; g.strokeRect(0.5, 0.5, s.x - 1, s.y - 1);
    return t;
  }
});

function aturPetaDasar() {
  var m = PETA.peta; if (!m) return;
  if (PETA.dasar) { m.removeLayer(PETA.dasar); PETA.dasar = null; }
  var p = S.pengaturan || {};
  var jenis = S.peta.dasar === 'kisi' ? 'kisi' : (p.petaJenis || 'kisi');
  if (S.peta.dasar === 'osm') jenis = 'osm';
  var maks = Number(p.petaMaksZoom) || 19;
  if (jenis === 'osm') {
    // URL resmi tanpa subdomain {s} (versi asli memakai subdomains 'abcd' -> ubin 'd' selalu gagal).
    PETA.dasar = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, maxNativeZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' });
  } else if (jenis === 'xyz' && p.petaUrl) {
    var sub = /\{s\}/.test(p.petaUrl) ? 'abc' : '';
    PETA.dasar = L.tileLayer(p.petaUrl, { maxZoom: 21, maxNativeZoom: maks, subdomains: sub, attribution: esc(p.petaAtribusi || 'Peta dasar pelanggan') });
    beritahuSwIzinUbin(p.petaUrl, p.petaIzinCache === 'true');
  } else {
    PETA.dasar = new KisiLokal({ maxZoom: 22, attribution: 'Kisi lokal (tanpa peta dasar pihak ketiga)' });
  }
  PETA.dasar.addTo(m);
  PETA.dasar.bringToBack();
}

function beritahuSwIzinUbin(url, izin) {
  try {
    var host = new URL(url.replace(/\{s\}/, 'a').replace(/\{[xyzr]\}/g, '0')).hostname;
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ tipe: 'izinUbin', host: host, izin: !!izin });
  } catch (e) { /* abaikan */ }
}

// ------------------------------------------------------------------ bilah cari & tombol
function bangunBilahCari() {
  var f = S.peta.filter;
  $('#cariPeta').innerHTML = '<input type="text" id="cariBlok" placeholder="Cari kode / nama blok…" value="' + esc(f.q) + '" enterkeyhint="search" aria-label="Cari blok">' +
    '<div class="pil"><button id="fReplant" class="' + (f.replanting ? 'aktif' : '') + '">♻️ Replanting</button><button id="fTinggi" class="' + (f.tinggi ? 'aktif' : '') + '">📈 Produktif</button>' +
    '<button id="fAfd">' + esc(f.afd === 'ALL' ? 'Semua afdeling' : namaAfdeling(f.afd)) + ' ▾</button></div>';
  $('#cariBlok').oninput = debounce(function () { f.q = $('#cariBlok').value; gambarBlok(); }, 200);
  $('#cariBlok').onkeydown = function (e) {
    if (e.key === 'Enter') { e.preventDefault(); var hasil = blokTersaring(); if (hasil.length) { pilihBlok(hasil[0].id, true); } else toast('Tidak ada blok cocok.'); }
  };
  $('#fReplant').onclick = function () { f.replanting = !f.replanting; bangunBilahCari(); gambarBlok(); };
  $('#fTinggi').onclick = function () { f.tinggi = !f.tinggi; bangunBilahCari(); gambarBlok(); };
  $('#fAfd').onclick = function () {
    var op = [['ALL', 'Semua afdeling']].concat(afdelingAktif().map(function (a) { return [a.id, a.nama]; }));
    modalBuka('Pilih afdeling', op.map(function (o) { return '<button class="tbl' + (f.afd === o[0] ? ' aktif' : '') + '" style="width:100%;margin-bottom:6px;justify-content:flex-start" data-afd="' + esc(o[0]) + '">' + esc(o[1]) + '</button>'; }).join(''), '', { tanpaFokus: true });
    $$('[data-afd]').forEach(function (b) { b.onclick = function () { f.afd = b.dataset.afd; modalTutup(); bangunBilahCari(); gambarBlok(); }; });
  };
}

function blokTersaring() {
  var f = S.peta.filter, q = f.q.trim().toLowerCase(), ambang = pengaturanAngka('ambangTinggiTonHa', 26);
  return blokAktif().filter(function (b) {
    if (q && String(b.kode).toLowerCase().indexOf(q) < 0 && String(b.nama).toLowerCase().indexOf(q) < 0) return false;
    if (f.afd !== 'ALL' && b.afdelingId !== f.afd) return false;
    if (f.replanting && !(b.kandidatReplanting || umurBlok(b) >= pengaturanAngka('umurReplanting', 25) || statReplanting(b).skor >= 45)) return false;
    if (f.tinggi && !((Number(b.produksiTonHa) || 0) >= ambang)) return false;
    return true;
  });
}

function bangunTombolPeta() {
  var t = [
    ['🗂️', 'Lapisan & peta dasar', bukaPanelLapisan],
    ['🎨', 'Tematik', bukaPanelTematik],
    ['🔖', 'Legenda', bukaPanelLegenda],
    ['📏', 'Ukur jarak / luas', bukaPanelUkur],
    ['🎯', 'Pusatkan ke kebun', pusatkanPeta],
    ['📍', 'Lokasi saya', lokasiSaya],
    ['⛶', 'Layar penuh', alihLayarPenuh]
  ];
  $('#tombolPeta').innerHTML = t.map(function (x, i) { return '<button class="tbl ikon" title="' + esc(x[1]) + '" aria-label="' + esc(x[1]) + '" data-i="' + i + '">' + x[0] + '</button>'; }).join('');
  $$('#tombolPeta button').forEach(function (b) { b.onclick = function () { t[Number(b.dataset.i)][2](); }; });
}

function pusatkanPeta() {
  var semua = titikBatasLingkup();
  if (semua.length) PETA.peta.fitBounds(L.latLngBounds(lintangBujur(semua)), { padding: [24, 24] });
}

function lokasiSaya() {
  if (!navigator.geolocation) { toast('Perangkat tidak mendukung GPS.', 'galat'); return; }
  toast('Mencari lokasi…');
  navigator.geolocation.getCurrentPosition(function (p) {
    var ll = [p.coords.latitude, p.coords.longitude];
    PETA.grup.pilih.clearLayers();
    L.circle(ll, { radius: p.coords.accuracy, color: '#22d3ee', weight: 1, fillOpacity: 0.12 }).addTo(PETA.grup.pilih);
    L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#06b6d4', fillOpacity: 1 }).addTo(PETA.grup.pilih);
    PETA.peta.setView(ll, Math.max(PETA.peta.getZoom(), 16));
    var b = blokDiTitik(ll[1], ll[0]);
    toast('Akurasi ±' + Math.round(p.coords.accuracy) + ' m' + (b ? ' • Anda di blok ' + b.kode : ' • di luar blok'), 'ok');
  }, function (e) { toast('GPS gagal: ' + e.message, 'galat'); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}

function alihLayarPenuh() {
  document.body.classList.toggle('layarPenuh');
  var on = document.body.classList.contains('layarPenuh');
  $('#kepala').style.display = on ? 'none' : '';
  $('#tabAtasWadah').style.display = on ? 'none' : '';
  $('#navBawah').style.visibility = on ? 'hidden' : '';
  document.documentElement.style.setProperty('--tinggiNav', on ? '0px' : '');
  if (!on) aturRuangBawah();
  if (on) history.pushState({ sgh: 'penuh' }, '');
  setTimeout(function () { var h = PENANGAN_TAB[S.tab]; if (h && h.ubahUkuran) h.ubahUkuran(); }, 50);
}
function keluarLayarPenuh() {
  if (!document.body.classList.contains('layarPenuh')) return false;
  alihLayarPenuh();
  return true;
}

// ------------------------------------------------------------------ lapisan
function gambarLapisan() {
  if (!PETA.peta) return;
  var L_ = S.peta.lapisan;
  var g = PETA.grup;
  ['kebun', 'afdeling', 'sungai', 'jalan', 'kanal', 'bangunan', 'pintu', 'sensor', 'cuaca', 'radar'].forEach(function (k) { g[k].clearLayers(); });
  var k = kebunAktif();
  if (L_.kebun) kebunTerpilih().forEach(function (kb) {
    if (kb.batas) L.polygon(lintangBujur(kb.batas[0]), { color: '#f59e0b', weight: 3, dashArray: '8 6', fill: false, interactive: false })
      .bindTooltip(esc(kb.nama) + (kb.perusahaan ? '<br>' + esc(kb.perusahaan) : ''), { sticky: true }).addTo(g.kebun);
  });
  if (L_.afdeling) afdelingAktif().forEach(function (a) {
    if (a.batas) L.polygon(lintangBujur(a.batas[0]), { color: warnaSah(a.warna, '#06b6d4'), weight: 2, opacity: 0.8, fill: false, interactive: false }).addTo(g.afdeling);
  });
  if (L_.sungai) daftarLingkup('sungai').forEach(function (s) {
    if (!s.garis) return;
    L.polyline(lintangBujur(s.garis), { color: '#0ea5e9', weight: 6, opacity: 0.9 }).bindTooltip(esc(s.nama) + ' • sempadan ' + (s.sempadanM || 50) + ' m').addTo(g.sungai);
  });
  gambarSempadan();
  if (L_.jalan) daftarLingkup('jalan').forEach(function (j) {
    if (!j.garis) return;
    var utama = j.jenis === 'Main_Road';
    L.polyline(lintangBujur(j.garis), { color: utama ? '#fbbf24' : '#d6d3d1', weight: utama ? 5 : 3, opacity: 0.95 })
      .bindPopup('<b>' + esc(j.nama) + '</b><br>' + esc(j.kode) + ' • ' + esc(j.permukaan || '') + '<br>Lebar ' + angka(j.lebarM, 1) + ' m • ' + angka(j.panjangM) + ' m<br>Kondisi: ' + esc(j.kondisi || '–')).addTo(g.jalan);
  });
  if (L_.kanal) daftarLingkup('kanal').forEach(function (c) {
    if (!c.garis) return;
    var prim = /Primary/i.test(c.orde);
    L.polyline(lintangBujur(c.garis), { color: '#22d3ee', weight: prim ? 4 : 2.5, opacity: 0.95, dashArray: prim ? null : '6 4' })
      .bindPopup('<b>' + esc(c.nama) + '</b><br>' + esc(c.kode) + ' • ' + esc(String(c.orde || '').replace(/_/g, ' ')) + '<br>Lebar atas ' + angka(c.lebarAtasM, 1) + ' m • dalam ' + angka(c.dalamM, 1) +
        ' m<br>Sedimentasi ' + persen(c.sedimentasiPct, 0) + ' • arah alir ' + angka(c.arahAlirDeg) + '°').addTo(g.kanal);
  });
  if (L_.bangunan) daftarLingkup('bangunan').forEach(function (b) {
    if (!b.batas) return;
    L.polygon(lintangBujur(b.batas[0]), { color: '#e2e8f0', weight: 1.5, fillColor: '#64748b', fillOpacity: 0.85 })
      .bindPopup('<b>' + esc(b.nama) + '</b><br>' + esc(b.kode) + ' • ' + angka(b.luasM2) + ' m² • tinggi ' + angka(b.tinggiM, 1) + ' m').addTo(g.bangunan);
  });
  if (L_.pintu) daftarLingkup('pintuAir').forEach(function (p) {
    if (!isFinite(p.lat)) return;
    var w = p.status === 'Closed' ? '#ef4444' : p.status === 'Open' ? '#10b981' : p.status === 'Maintenance' ? '#94a3b8' : '#f59e0b';
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div class="ikonTitik" style="width:18px;height:18px;background:' + w + ';border-radius:4px"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) })
      .bindPopup('<b>' + esc(p.nama) + '</b><br>' + esc(p.kode) + ' • ' + esc(labelStatusPintu(p.status)) + ' ' + angka(p.bukaanPct) + '%<br>Hulu ' + angka(p.mukaHuluCm) + ' cm • hilir ' + angka(p.mukaHilirCm) + ' cm' +
        (fitur('iot') ? '<br><button class="tbl kecil" style="margin-top:8px" onclick="bukaTab(\'iot\',\'pintu\')">Kendalikan</button>' : '')).addTo(g.pintu);
  });
  if (L_.sensor) daftarLingkup('sensor').forEach(function (s) {
    if (!isFinite(s.lat) || !s.aktif) return;
    var st = statusSensor(s);
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="ikonTitik' + (st.kode !== 'AMAN' ? ' denyut' : '') + '" style="width:14px;height:14px;background:' + st.warna + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) })
      .bindPopup('<b>' + esc(s.nama) + '</b><br>' + esc(s.kode) + '<br>Nilai: <b>' + angka(s.nilaiTerakhir, 1) + ' ' + esc(s.satuan || '') + '</b> • ' + esc(st.label) +
        '<br>Baterai ' + angka(s.baterai) + '% • ' + relatif(s.terakhirKirim)).addTo(g.sensor);
  });
  if (L_.cuaca) daftarLingkup('cuaca').forEach(function (c) {
    if (!isFinite(c.lat)) return;
    L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: '<div style="font-size:18px;filter:drop-shadow(0 0 3px #000)">🌦️</div>', iconSize: [20, 20], iconAnchor: [10, 10] }) })
      .bindPopup('<b>' + esc(c.nama) + '</b><br>Hujan ' + angka(c.hujanMmJam, 1) + ' mm/jam • 24 jam ' + angka(c.hujan24Mm, 1) + ' mm<br>Suhu ' + angka(c.suhuC, 1) + '°C • RH ' + angka(c.rhPct) +
        '%<br>Angin ' + angka(c.anginKmh, 1) + ' km/j dari ' + angka(c.arahAnginDeg) + '°<br>Muka air ±' + angka(c.mukaAirCm) + ' cm').addTo(g.cuaca);
  });
  if (L_.radar) daftarLingkup('cuaca').forEach(function (c) {
    if (!isFinite(c.lat) || !(c.hujanMmJam > 0)) return;
    var i = Number(c.hujanMmJam);
    L.circle([c.lat, c.lng], { radius: 300 + i * 35, stroke: false, fillColor: i > 20 ? '#06b6d4' : i > 10 ? '#10b981' : '#38bdf8', fillOpacity: 0.18 + Math.min(0.3, i / 80), interactive: false }).addTo(g.radar);
  });
  gambarBlok();
  if (typeof gambarGpsDiPeta === 'function') gambarGpsDiPeta();
}

function labelStatusPintu(s) { return { Open: 'Terbuka', Closed: 'Tertutup', Partially_Open: 'Sebagian terbuka', Maintenance: 'Perawatan' }[s] || s || '–'; }

/** Sempadan sungai: garis selebar 2× sempadanM dalam piksel sesuai skala zoom saat ini. */
function gambarSempadan() {
  var m = PETA.peta; if (!m || !PETA.grup.sempadan) return;
  PETA.grup.sempadan.clearLayers();
  if (!S.peta.lapisan.sempadan) return;
  daftarLingkup('sungai').forEach(function (s) {
    if (!s.garis || !s.garis.length) return;
    var lat = s.garis[0][1];
    var mPerPx = 40075016.686 * Math.cos(lat * RAD) / Math.pow(2, m.getZoom() + 8);
    var px = Math.max(2, 2 * (Number(s.sempadanM) || 50) / mPerPx);
    L.polyline(lintangBujur(s.garis), { color: '#0ea5e9', weight: px, opacity: 0.16, lineCap: 'round', interactive: false }).addTo(PETA.grup.sempadan);
  });
}

function gaya(b) {
  var t = S.peta.tematik;
  var warna = t ? warnaTematik(b, t, S.peta.bulanPrediksi) : warnaSimbologi(b, S.peta.simbologi);
  var terpilih = S.peta.blokId === b.id;
  return { color: terpilih ? '#ffffff' : '#0b1324', weight: terpilih ? 3 : 1.2, fillColor: warna, fillOpacity: S.peta.opasitas * (terpilih ? 1 : 0.85), opacity: 1 };
}

function gambarBlok() {
  var g = PETA.grup; if (!g.blok) return;
  g.blok.clearLayers(); g.label.clearLayers(); PETA.polBlok = {};
  if (!S.peta.lapisan.blok) return;
  var tersaring = blokTersaring();
  tersaring.forEach(function (b) {
    if (!b.batas) return;
    // Poligon interaktif:false - klik ditangani di peta lewat titik-dalam-poligon agar label tidak menghalangi ketukan.
    var pol = L.polygon(lintangBujur(b.batas[0]), Object.assign(gaya(b), { interactive: false })).addTo(g.blok);
    PETA.polBlok[b.id] = pol;
  });
  aturLabel(tersaring);
}

function aturLabel(tersaring) {
  var g = PETA.grup; if (!g.label || !PETA.peta) return;
  g.label.clearLayers();
  if (!S.peta.lapisan.label || PETA.peta.getZoom() < 14) return;
  (tersaring || blokTersaring()).forEach(function (b) {
    if (!isFinite(b.pusatLat)) return;
    var teks = b.kode;
    if (S.peta.tematik === 'NDVI' && b.ndvi !== null) teks += ' • ' + angka(b.ndvi, 2);
    else if (S.peta.tematik === 'PRODUKSI' || S.peta.simbologi === 'produksi') teks += ' • ' + angka(b.produksiTonHa, 1) + 't';
    else if (S.peta.tematik === 'PREDIKSI') teks += ' • ' + angka(statPrediksi(b, S.peta.bulanPrediksi).bulanTonHa, 2) + 't';

/* ---- 07-tiga.js ---- */
/* =====================================================================
 * 07-tiga.js - fondasi 3D: pemuat three.js, kendali orbit ramah sentuh,
 *              render sesuai kebutuhan, mesh terrain + tekstur analitik,
 *              tab Topografi 3D
 * ===================================================================== */
var DUNIA = 200; // lebar dunia 3D (unit) untuk sisi terpanjang kebun

/** Kendali orbit sendiri (tanpa OrbitControls tambahan): 1 jari/klik kiri = putar,
 *  2 jari = cubit zoom + geser, klik kanan / Shift = geser, roda = zoom, dengan redaman. */
function OrbitKu(kamera, dom, saatUbah) {
  this.k = kamera; this.dom = dom; this.saatUbah = saatUbah;
  this.target = new THREE.Vector3(0, 10, 0);
  this.r = 180; this.teta = 0; this.phi = 1.0; this.minR = 8; this.maksR = 700; this.maksPhi = Math.PI / 2 - 0.03;
  this.vTeta = 0; this.vPhi = 0; this.redam = 0.88; this.aktif = true;
  this._p = {}; this._dua = null; this.mulaiDari();
  var s = this;
  this._turun = function (e) { if (!s.aktif) return; dom.setPointerCapture && dom.setPointerCapture(e.pointerId); s._p[e.pointerId] = { x: e.clientX, y: e.clientY, tombol: e.button, shift: e.shiftKey }; s._dua = null; s._geser = false; s._x0 = e.clientX; s._y0 = e.clientY; };
  this._gerak = function (e) {
    var p = s._p[e.pointerId]; if (!p) return;
    var ids = Object.keys(s._p);
    if (ids.length === 2) {
      var a = s._p[ids[0]], b = s._p[ids[1]];
      p.x = e.clientX; p.y = e.clientY;
      var d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      if (s._dua) { s.r = jepit(s.r * s._dua.d / Math.max(d, 1), s.minR, s.maksR); s.geser(cx - s._dua.cx, cy - s._dua.cy); }
      s._dua = { d: d, cx: cx, cy: cy };
      s.terapkan(); return;
    }
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.abs(e.clientX - s._x0) + Math.abs(e.clientY - s._y0) > 4) s._geser = true;
    if (p.tombol === 2 || p.shift) s.geser(dx, dy);
    else { s.vTeta = -dx * 0.006; s.vPhi = -dy * 0.006; s.teta += s.vTeta; s.phi = jepit(s.phi + s.vPhi, 0.05, s.maksPhi); }
    s.terapkan();
  };
  this._naik = function (e) { delete s._p[e.pointerId]; s._dua = null; s.lanjutInersia(); };
  this._roda = function (e) { e.preventDefault(); s.r = jepit(s.r * (e.deltaY > 0 ? 1.1 : 0.9), s.minR, s.maksR); s.terapkan(); };
  this._menu = function (e) { e.preventDefault(); };
  dom.addEventListener('pointerdown', this._turun);
  dom.addEventListener('pointermove', this._gerak);
  dom.addEventListener('pointerup', this._naik);
  dom.addEventListener('pointercancel', this._naik);
  dom.addEventListener('wheel', this._roda, { passive: false });
  dom.addEventListener('contextmenu', this._menu);
}
OrbitKu.prototype.mulaiDari = function (r, teta, phi, target) {
  if (r) this.r = r; if (teta !== undefined) this.teta = teta; if (phi !== undefined) this.phi = phi;
  if (target) this.target.copy(target);
  this.terapkan();
};
OrbitKu.prototype.geser = function (dx, dy) {
  var f = this.r / 600;
  var kanan = new THREE.Vector3(Math.cos(this.teta), 0, -Math.sin(this.teta));
  var maju = new THREE.Vector3(Math.sin(this.teta), 0, Math.cos(this.teta));
  this.target.addScaledVector(kanan, -dx * f).addScaledVector(maju, -dy * f);
  this.target.x = jepit(this.target.x, -DUNIA, DUNIA); this.target.z = jepit(this.target.z, -DUNIA, DUNIA);
};
OrbitKu.prototype.terapkan = function () {
  var sp = Math.sin(this.phi);
  this.k.position.set(this.target.x + this.r * sp * Math.sin(this.teta), this.target.y + this.r * Math.cos(this.phi), this.target.z + this.r * sp * Math.cos(this.teta));
  this.k.lookAt(this.target);
  if (this.saatUbah) this.saatUbah();
};
OrbitKu.prototype.lanjutInersia = function () {
  var s = this;
  if (Object.keys(s._p).length) return;
  var langkah = function () {
    if (Object.keys(s._p).length || (Math.abs(s.vTeta) < 0.0004 && Math.abs(s.vPhi) < 0.0004)) return;
    s.vTeta *= s.redam; s.vPhi *= s.redam;
    s.teta += s.vTeta; s.phi = jepit(s.phi + s.vPhi, 0.05, s.maksPhi);
    s.terapkan();
    requestAnimationFrame(langkah);
  };
  requestAnimationFrame(langkah);
};
OrbitKu.prototype.lepas = function () {
  var d = this.dom;
  d.removeEventListener('pointerdown', this._turun); d.removeEventListener('pointermove', this._gerak);
  d.removeEventListener('pointerup', this._naik); d.removeEventListener('pointercancel', this._naik);
  d.removeEventListener('wheel', this._roda); d.removeEventListener('contextmenu', this._menu);
};

/** Ruang pandang 3D: render hanya saat diminta (hemat baterai) kecuali mode animasi. */
function Ruang3D(wadah, opsi) {
  opsi = opsi || {};
  var s = this;
  this.wadah = wadah;
  var w = wadah.clientWidth || 300, h = wadah.clientHeight || 300;
  this.scene = new THREE.Scene();
  this.scene.background = new THREE.Color(opsi.latar || 0x060b13);
  if (opsi.kabut !== false) this.scene.fog = new THREE.FogExp2(opsi.latar || 0x060b13, opsi.kabut || 0.0018);
  this.kamera = new THREE.PerspectiveCamera(45, w / h, 0.5, 3000);
  var lemah = infoPerangkat().lemah;
  this.renderer = new THREE.WebGLRenderer({ antialias: !lemah, powerPreference: 'high-performance', preserveDrawingBuffer: !!opsi.tangkap });
  this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lemah ? 1.25 : 2));
  this.renderer.setSize(w, h);
  wadah.appendChild(this.renderer.domElement);
  this.kendali = new OrbitKu(this.kamera, this.renderer.domElement, function () { s.minta(); });
  this.animasi = !!opsi.animasi;
  this._diminta = false; this._hidup = true; this.saatFrame = null;
  this.jam = new THREE.Clock();
  this.fps = 0; this._f = 0; this._t = performance.now();
  var loop = function () {
    if (!s._hidup) return;
    s._raf = requestAnimationFrame(loop);
    if (document.hidden) return;
    if (!s.animasi && !s._diminta) return;
    s._diminta = false;
    if (s.saatFrame) s.saatFrame(s.jam.getElapsedTime());
    s.renderer.render(s.scene, s.kamera);
    s._f++;
    var t = performance.now();
    if (t - s._t > 1000) { s.fps = Math.round(s._f * 1000 / (t - s._t)); s._f = 0; s._t = t; }
  };
  this._raf = requestAnimationFrame(loop);
  this._ukur = function () { s.ubahUkuran(); };
}
Ruang3D.prototype.minta = function () { this._diminta = true; };
Ruang3D.prototype.ubahUkuran = function () {
  var w = this.wadah.clientWidth, h = this.wadah.clientHeight;
  if (!w || !h) return;
  this.kamera.aspect = w / h; this.kamera.updateProjectionMatrix();
  this.renderer.setSize(w, h); this.minta();
};
Ruang3D.prototype.buang = function () {
  this._hidup = false;
  cancelAnimationFrame(this._raf);
  this.kendali.lepas();
  buangObjek(this.scene);
  this.renderer.dispose();
  if (this.renderer.forceContextLoss) this.renderer.forceContextLoss();
  if (this.renderer.domElement.parentNode) this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
};

/** Buang geometri, material & tekstur secara rekursif (versi asli membocorkan memori GPU tiap ganti setelan). */
function buangObjek(o) {
  if (!o) return;
  o.traverse(function (c) {
    if (c.geometry && !c.geometry._dibagi) c.geometry.dispose();
    if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach(function (m) {
      ['map', 'emissiveMap'].forEach(function (k) { if (m[k]) m[k].dispose(); });
      m.dispose();
    });
  });
}
function kosongkanGrup(g) {
  while (g.children.length) { var c = g.children[0]; g.remove(c); buangObjek(c); }
}

/** Pemetaan geografis -> dunia 3D (sumbu X timur, Z selatan, Y elevasi). */
function pemetaDunia(dem, eksagerasi) {
  var lebarM = (dem.kb.maxLng - dem.kb.minLng) * 111320 * Math.cos((dem.kb.minLat + dem.kb.maxLat) / 2 * RAD);
  var tinggiM = (dem.kb.maxLat - dem.kb.minLat) * 110540;
  var skala = DUNIA / Math.max(lebarM, tinggiM); // unit per meter
  var W = lebarM * skala, D = tinggiM * skala;
  var ey = skala * (eksagerasi || 1) * 2.2; // elevasi dibesarkan agar relief terbaca pada kebun datar
  return {
    W: W, D: D, skala: skala, ey: ey,
    ke: function (lng, lat, tambah) {
      var u = (lng - dem.kb.minLng) / (dem.kb.maxLng - dem.kb.minLng), v = (dem.kb.maxLat - lat) / (dem.kb.maxLat - dem.kb.minLat);
      return new THREE.Vector3((u - 0.5) * W, (elevasiDi(dem, lng, lat) - dem.min) * ey + (tambah || 0), (v - 0.5) * D);
    },
    dari: function (x, z) {
      var u = x / W + 0.5, v = z / D + 0.5;
      return { lng: dem.kb.minLng + u * (dem.kb.maxLng - dem.kb.minLng), lat: dem.kb.maxLat - v * (dem.kb.maxLat - dem.kb.minLat) };
    }
  };
}

function geometriTerrain(dem, peta) {
  var g = new THREE.PlaneGeometry(peta.W, peta.D, dem.lebar - 1, dem.tinggi - 1);
  g.rotateX(-Math.PI / 2);
  var pos = g.attributes.position;
  for (var i = 0; i < pos.count; i++) pos.setY(i, (dem.z[i] - dem.min) * peta.ey);
  g.computeVertexNormals();
  return g;
}

function hsvKeRgb(h, s, v) {
  var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

/** Tekstur analitik: elevasi (hipsometri + bayangan bukit), lereng, aspek, bayangan bukit, kontur. */
function teksturTerrain(dem, mode, kontur, interval) {
  var w = dem.lebar, h = dem.tinggi, sup = 4;
  var c = document.createElement('canvas'); c.width = w * sup; c.height = h * sup;
  var ctx = c.getContext('2d'), img = ctx.createImageData(c.width, c.height), d = img.data;
  var rentang = Math.max(1, dem.max - dem.min);
  var analisis = new Array(w * h);
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) { var la = lerengAspek(dem, x, y); la.hs = bayangBukit(la.derajat, la.aspek); analisis[y * w + x] = la; }
  for (var py = 0; py < c.height; py++) {
    var gy = Math.min(h - 1, py / sup), y0 = Math.floor(gy);
    for (var px = 0; px < c.width; px++) {
      var gx = Math.min(w - 1, px / sup), x0 = Math.floor(gx);
      var x1 = Math.min(w - 1, x0 + 1), y1 = Math.min(h - 1, y0 + 1), fx = gx - x0, fy = gy - y0;
      var e = (dem.z[y0 * w + x0] * (1 - fx) + dem.z[y0 * w + x1] * fx) * (1 - fy) + (dem.z[y1 * w + x0] * (1 - fx) + dem.z[y1 * w + x1] * fx) * fy;
      var a = analisis[y0 * w + x0], n = (e - dem.min) / rentang, r, g, b;
      if (mode === 'slope') {
        var sd = a.derajat;
        if (sd < 3) { r = 16; g = 185; b = 129; } else if (sd < 8) { r = 245; g = 158; b = 11; } else if (sd < 15) { r = 234; g = 88; b = 12; } else { r = 239; g = 68; b = 68; }
      } else if (mode === 'aspect') {
        if (a.aspek < 0) { r = g = b = 100; } else { var rgb = hsvKeRgb(a.aspek, 0.85, 0.9); r = rgb[0]; g = rgb[1]; b = rgb[2]; }
      } else if (mode === 'hillshade') { r = g = b = a.hs; }
      else {
        if (n < 0.25) { var t = n / 0.25; r = 16 + t * 24; g = 120 + t * 65; b = 70 + t * 20; }
        else if (n < 0.55) { t = (n - 0.25) / 0.3; r = 40 + t * 180; g = 185 + t * 40; b = 90 - t * 40; }
        else if (n < 0.85) { t = (n - 0.55) / 0.3; r = 220 + t * 30; g = 225 - t * 115; b = 50 - t * 20; }
        else { t = (n - 0.85) / 0.15; r = 250; g = 110 + t * 145; b = 30 + t * 225; }
        var f = 0.45 + a.hs / 255 * 0.55; r *= f; g *= f; b *= f;
      }
      if (kontur) {
        var sisa = e % interval;
        if (sisa < 0) sisa += interval;
        // Tebal garis mengikuti gradien (meter elevasi per piksel tekstur) - versi asli memakai
        // ambang tetap sehingga daerah datar di sekitar nilai kontur menjadi bercak putih lebar.
        var tebal = Math.max(0.004, (a.persen / 100) * (dem.ukuranSelM || 30) / sup * 0.9);
        if (sisa < tebal || interval - sisa < tebal) {
          var indeks = Math.round(e / interval) % 5 === 0;
          if (indeks) { r = g = b = 255; } else { r = Math.min(255, r + 70); g = Math.min(255, g + 70); b = Math.min(255, b + 70); }
        }
      }
      var i = (py * c.width + px) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

/** Garis vektor (batas blok, jalan, kanal, sungai) mengikuti permukaan terrain. */
function garisDiTerrain(titik, peta, warna, naik) {
  var pts = [];
  for (var i = 0; i < titik.length; i++) {
    if (i > 0) {
      var a = titik[i - 1], b = titik[i], n = Math.max(1, Math.ceil(jarakM(a, b) / 60));
      for (var j = 1; j < n; j++) pts.push(peta.ke(a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n, naik));
    }
    pts.push(peta.ke(titik[i][0], titik[i][1], naik));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: warna, transparent: true, opacity: 0.95 }));
}

function grupVektor(peta, opsi) {
  opsi = opsi || {};
  var g = new THREE.Group();
  blokAktif().forEach(function (b) {
    if (!b.batas) return;
    var w = opsi.warnaBlok ? opsi.warnaBlok(b) : 0x38bdf8;
    g.add(garisDiTerrain(b.batas[0], peta, w, 0.6));
  });
  daftarLingkup('jalan').forEach(function (j) { if (j.garis) g.add(garisDiTerrain(j.garis, peta, j.jenis === 'Main_Road' ? 0xfbbf24 : 0xd6d3d1, 0.8)); });
  daftarLingkup('kanal').forEach(function (c) { if (c.garis) g.add(garisDiTerrain(c.garis, peta, 0x22d3ee, 0.5)); });
  daftarLingkup('sungai').forEach(function (s) { if (s.garis) g.add(garisDiTerrain(s.garis, peta, 0x0ea5e9, 0.4)); });
  return g;
}

function bangunTerrain() {
  var r = TERRAIN.ruang; if (!r) return;
  var t = S.tiga, dem = demKebun();
  if (TERRAIN.mesh) { r.scene.remove(TERRAIN.mesh); buangObjek(TERRAIN.mesh); }
  if (TERRAIN.vektor) { r.scene.remove(TERRAIN.vektor); buangObjek(TERRAIN.vektor); TERRAIN.vektor = null; }
  TERRAIN.peta = pemetaDunia(dem, t.eksagerasi);
  var mat = new THREE.MeshStandardMaterial({ map: teksturTerrain(dem, t.shading, t.kontur, t.interval), roughness: 0.85, metalness: 0.05 });
  TERRAIN.mesh = new THREE.Mesh(geometriTerrain(dem, TERRAIN.peta), mat);
  r.scene.add(TERRAIN.mesh);
  if (t.vektor) { TERRAIN.vektor = grupVektor(TERRAIN.peta); r.scene.add(TERRAIN.vektor); }
  r.minta();
}

function pasangHoverTerrain(dom) {
  var ray = new THREE.Raycaster(), m = new THREE.Vector2();
  var tangani = function (e) {
    var r = TERRAIN.ruang; if (!r || !TERRAIN.mesh) return;
    var b = dom.getBoundingClientRect();
    m.x = (e.clientX - b.left) / b.width * 2 - 1; m.y = -((e.clientY - b.top) / b.height) * 2 + 1;
    ray.setFromCamera(m, r.kamera);
    var hit = ray.intersectObject(TERRAIN.mesh)[0];
    var el = $('#infoHover'), hud = $('#hud-terrain');
    if (!hit) return;
    var dem = demKebun(), g = TERRAIN.peta.dari(hit.point.x, hit.point.z);
    var gx = Math.round((g.lng - dem.kb.minLng) / (dem.kb.maxLng - dem.kb.minLng) * (dem.lebar - 1));
    var gy = Math.round((dem.kb.maxLat - g.lat) / (dem.kb.maxLat - dem.kb.minLat) * (dem.tinggi - 1));
    var la = lerengAspek(dem, gx, gy), bl = blokDiTitik(g.lng, g.lat);
    var arah = la.aspek < 0 ? 'datar' : ['U', 'TL', 'T', 'TG', 'S', 'BD', 'B', 'BL'][Math.round(la.aspek / 45) % 8];
    var teks = 'Elevasi ' + angka(elevasiDi(dem, g.lng, g.lat), 1) + ' m • lereng ' + angka(la.derajat, 1) + '° (' + angka(la.persen, 1) + '%) • aspek ' + (la.aspek < 0 ? 'datar' : angka(la.aspek) + '° ' + arah) + (bl ? ' • ' + bl.kode : '');
    if (el) el.textContent = teks;
    if (hud) hud.textContent = g.lat.toFixed(5) + ', ' + g.lng.toFixed(5) + ' • ' + teks;
  };
  dom.addEventListener('pointermove', debounce(tangani, 30));
  dom.addEventListener('click', tangani);
}

/* ---- 08-kembar.js ---- */
/* =====================================================================
 * 08-kembar.js - Digital Twin 3D: ribuan pokok sawit via InstancedMesh,
 *                LOD 1-4 + AUTO sungguhan (anggaran segitiga per perangkat),
 *                warna kesehatan dari sensus, batas blok, jalan, PKS
 * ===================================================================== */
var KEMBAR = { ruang: null, grup: null, tanah: null, infra: null, pokok: [], mesh: [], peta: null, geo: null, pilihan: null, sensus: null };

/** Gabung geometri: SELALU dijadikan non-indeks dulu. Versi asli menyalin atribut posisi
 *  dari PlaneGeometry berindeks tanpa indeksnya sehingga pelepah tergambar sebagai
 *  segitiga acak (geometri rusak). */
function gabungGeometri(daftarG) {
  var pos = [], nor = [];
  daftarG.forEach(function (g) {
    var n = g.index ? g.toNonIndexed() : g;
    if (!n.attributes.normal) n.computeVertexNormals();
    Array.prototype.push.apply(pos, n.attributes.position.array);
    Array.prototype.push.apply(nor, n.attributes.normal.array);
    if (n !== g) n.dispose();
    g.dispose();
  });
  var h = new THREE.BufferGeometry();
  h.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  h.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  h._dibagi = true;
  return h;
}

/** Geometri pokok dalam METER untuk pokok setinggi 10 m (disekala per instans). */
function geometriPokok() {
  if (KEMBAR.geo) return KEMBAR.geo;
  var T = 8.2;
  function batang(seg) { var g = new THREE.CylinderGeometry(0.32, 0.45, T, seg, 1, true); g.translate(0, T / 2, 0); return g; }
  function pelepah(n, lebar, panjang, sb, lengkung, miring) {
    var list = [];
    for (var i = 0; i < n; i++) {
      var f = new THREE.PlaneGeometry(lebar, panjang, 1, sb);
      var p = f.attributes.position;
      for (var j = 0; j < p.count; j++) { var y = p.getY(j), t = (y + panjang / 2) / panjang; p.setZ(j, -t * t * lengkung); }
      f.translate(0, panjang / 2, 0);
      f.rotateX(-miring);
      f.rotateY(i / n * Math.PI * 2 + (i % 2) * 0.17);
      f.translate(0, T, 0);
      list.push(f);
    }
    return list;
  }
  var lod1 = new THREE.IcosahedronGeometry(3.6, 0); lod1.scale(1, 0.55, 1); lod1.translate(0, T + 0.4, 0); lod1._dibagi = true;
  var lod2b = batang(6); lod2b._dibagi = true;
  var lod2k = new THREE.ConeGeometry(4.0, 2.6, 8, 1, true); lod2k.rotateX(Math.PI); lod2k.translate(0, T + 0.6, 0); lod2k._dibagi = true;
  var lod3b = batang(8); lod3b._dibagi = true;
  var lod3p = gabungGeometri(pelepah(12, 0.9, 4.6, 4, 1.6, Math.PI / 3.2));
  var lod4b = batang(10); lod4b._dibagi = true;
  var lod4p = gabungGeometri(pelepah(20, 1.0, 5.0, 6, 2.1, Math.PI / 3.4));
  var buah = [];
  for (var i = 0; i < 4; i++) { var a = i / 4 * Math.PI * 2 + 0.3, d = new THREE.DodecahedronGeometry(0.5); d.scale(1.2, 1.4, 1); d.translate(Math.cos(a) * 0.6, T - 0.5, Math.sin(a) * 0.6); buah.push(d); }
  var lod4buah = gabungGeometri(buah);
  KEMBAR.geo = {
    1: [{ g: lod1, warna: true, tris: 20 }],
    2: [{ g: lod2b, batang: true, tris: 12 }, { g: lod2k, warna: true, tris: 8 }],
    3: [{ g: lod3b, batang: true, tris: 16 }, { g: lod3p, warna: true, tris: 96 }],
    4: [{ g: lod4b, batang: true, tris: 20 }, { g: lod4p, warna: true, tris: 240 }, { g: lod4buah, buah: true, tris: 48 }]
  };
  return KEMBAR.geo;
}

function trisLod(l) { return geometriPokok()[l].reduce(function (a, x) { return a + x.tris; }, 0); }

/** LOD & kepadatan AUTO: pilih detail tertinggi yang muat anggaran segitiga perangkat. */
function rencanaLod(jumlah) {
  var t = S.tiga, inf = infoPerangkat();
  var anggaran = inf.lemah ? 350000 : inf.ponsel ? 800000 : 2500000;
  var kepadatan = t.kepadatan === 'AUTO' ? null : Number(t.kepadatan);
  var lod = t.lod === 'AUTO' ? null : Number(t.lod);
  if (lod && kepadatan) return { lod: lod, langkah: kepadatan };
  if (lod) { var k = 1; while (jumlah / k * trisLod(lod) > anggaran * 2 && k < 16) k *= 2; return { lod: lod, langkah: kepadatan || k }; }
  var langkah = kepadatan || 1;
  for (var l = 4; l >= 1; l--) if (jumlah / langkah * trisLod(l) <= anggaran) return { lod: l, langkah: langkah };
  if (!kepadatan) { langkah = 1; while (jumlah / langkah * trisLod(1) > anggaran && langkah < 32) langkah *= 2; }
  return { lod: 1, langkah: langkah };
}

function skalaPokok(p) {
  var umur = Math.max(1, S.tahun - (p.tahunTanam || S.tahun));
  var tajuk = umur < 4 ? 0.55 : umur < 7 ? 0.85 : umur < 15 ? 1.0 : 1.08;
  return { v: Math.max(0.25, (p.tinggiM || 8) / 10), h: tajuk };
}

function muatSensus() {
  if (KEMBAR.sensus) return Promise.resolve(KEMBAR.sensus);
  return panggil('data_daftar', { lembar: 'SensusPokok', batas: 1000 }).then(function (r) {

    r.baris.slice().reverse().forEach(function (s) { peta[s.nomorPokok] = s; }); // yang terbaru menang
    KEMBAR.sensus = peta;
    return peta;
  }).catch(function () { KEMBAR.sensus = { _v: 0 }; return KEMBAR.sensus; });
}

  r.scene.add(KEMBAR.tanah);

  bangunPokok();
}

function bangunInfra() {
  var r = KEMBAR.ruang, pt = KEMBAR.peta, t = S.tiga;
  if (KEMBAR.infra) { r.scene.remove(KEMBAR.infra); buangObjek(KEMBAR.infra); }
  var g = new THREE.Group();

    if (!b.batas) return;

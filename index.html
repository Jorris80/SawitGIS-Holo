    var rp = statReplanting(b), warna = rp.skor >= 70 ? 0xef4444 : rp.skor >= 45 ? 0xf97316 : 0x38bdf8;
    g.add(garisDiTerrain(b.batas[0], pt, warna, 0.5));
    g.add(dindingBatas(b.batas[0], pt, warna));
  });
  if (t.tampilJalan) daftarLingkup('jalan').forEach(function (j) { if (j.garis) g.add(pitaJalan(j, pt)); });
  daftarLingkup('kanal').forEach(function (c) { if (c.garis) g.add(garisDiTerrain(c.garis, pt, 0x22d3ee, 0.3)); });
  daftarLingkup('sungai').forEach(function (s) { if (s.garis) g.add(pitaGaris(s.garis, pt, Math.max(1, (s.lebarM || 20) * pt.skala), 0x0369a1, 0.15)); });
  if (t.tampilBangunan) daftarLingkup('bangunan').forEach(function (b) { g.add(bangunan3D(b, pt)); });
  KEMBAR.infra = g;
  r.scene.add(g);
  r.minta();
}

function dindingBatas(cincin, pt, warna) {
  var pos = [], tinggi = 1.4;
  for (var i = 1; i < cincin.length; i++) {
    var a = pt.ke(cincin[i - 1][0], cincin[i - 1][1], 0.2), b = pt.ke(cincin[i][0], cincin[i][1], 0.2);
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z, b.x, b.y + tinggi, b.z, a.x, a.y, a.z, b.x, b.y + tinggi, b.z, a.x, a.y + tinggi, a.z);
  }
  var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: warna, transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false }));
}

function pitaGaris(titik, pt, lebar, warna, naik) {
  var pts = [];
  for (var i = 0; i < titik.length; i++) {
    if (i > 0) { var a = titik[i - 1], b = titik[i], n = Math.max(1, Math.ceil(jarakM(a, b) / 50)); for (var j = 1; j < n; j++) pts.push(pt.ke(a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n, naik)); }
    pts.push(pt.ke(titik[i][0], titik[i][1], naik));
  }
  var pos = [];
  for (var k = 1; k < pts.length; k++) {
    var p1 = pts[k - 1], p2 = pts[k], d = new THREE.Vector3().subVectors(p2, p1); d.y = 0; d.normalize();
    var nx = -d.z * lebar / 2, nz = d.x * lebar / 2;
    pos.push(p1.x - nx, p1.y, p1.z - nz, p1.x + nx, p1.y, p1.z + nz, p2.x - nx, p2.y, p2.z - nz, p1.x + nx, p1.y, p1.z + nz, p2.x + nx, p2.y, p2.z + nz, p2.x - nx, p2.y, p2.z - nz);
  }
  var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: warna, roughness: 0.9, side: THREE.DoubleSide }));
}
function pitaJalan(j, pt) {
  var lebar = Math.max(0.6, (j.lebarM || 6) * pt.skala * 3);
  return pitaGaris(j.garis, pt, lebar, j.jenis === 'Main_Road' ? 0xb45309 : 0x8b8b8b, 0.25);
}

function bangunan3D(b, pt) {
  var g = new THREE.Group();
  if (!b.batas) return g;
  var kb = kotakBatas(b.batas[0]);
  var c = pt.ke((kb.minLng + kb.maxLng) / 2, (kb.minLat + kb.maxLat) / 2);
  var lebar = Math.max(1, jarakM([kb.minLng, kb.minLat], [kb.maxLng, kb.minLat]) * pt.skala * 1.4);
  var dalam = Math.max(1, jarakM([kb.minLng, kb.minLat], [kb.minLng, kb.maxLat]) * pt.skala * 1.4);
  var tinggi = Math.max(0.8, (b.tinggiM || 6) * pt.skala * 3);
  var badan = new THREE.Mesh(new THREE.BoxGeometry(lebar, tinggi, dalam), new THREE.MeshStandardMaterial({ color: b.jenis === 'Palm_Oil_Mill' ? 0x475569 : 0x0284c7, roughness: 0.6, metalness: 0.4 }));
  badan.position.set(c.x, c.y + tinggi / 2, c.z); g.add(badan);
  if (b.jenis === 'Palm_Oil_Mill') {
    var cer = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, tinggi * 3, 12), new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7 }));
    cer.position.set(c.x + lebar / 2 + 0.6, c.y + tinggi * 1.5, c.z); g.add(cer);
    for (var i = 0; i < 4; i++) {
      var tg = new THREE.Mesh(new THREE.CylinderGeometry(lebar * 0.12, lebar * 0.12, tinggi * 0.9, 18), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.2 }));
      tg.position.set(c.x - lebar / 2 + lebar * 0.15 + (i % 2) * lebar * 0.3, c.y + tinggi * 0.45, c.z + dalam / 2 + lebar * 0.2 + Math.floor(i / 2) * lebar * 0.28); g.add(tg);
    }
  }
  return g;
}

function bangunPokok() {
  var r = KEMBAR.ruang, pt = KEMBAR.peta, t = S.tiga;
  KEMBAR.mesh.forEach(function (m) { KEMBAR.grup.remove(m); m.material.dispose(); m.dispose && m.dispose(); });
  KEMBAR.mesh = [];
  var semua = [];
  blokAktif().forEach(function (b) {
    if (t.isolasi && t.fokusBlok && b.id !== t.fokusBlok) return;
    Array.prototype.push.apply(semua, pokokBlok(b, KEMBAR.sensus));
  });
  var filter = t.kesehatan;
  if (filter !== 'ALL') semua = semua.filter(function (p) {
    if (filter === 'SEHAT') return p.status === 'Sehat';
    if (filter === 'GANODERMA') return p.status === 'Ganoderma';
    if (filter === 'MASALAH') return p.status !== 'Sehat';
    if (filter === 'MATI') return p.status === 'Mati' || p.status === 'Tunggul';
    return true;
  });
  var rencana = rencanaLod(semua.length);
  // Pokok bermasalah selalu ditampilkan walau kepadatan dijarangkan - justru itu yang dicari.
  var tampil = rencana.langkah > 1 ? semua.filter(function (p, i) { return p.status !== 'Sehat' || i % rencana.langkah === 0; }) : semua;
  KEMBAR.pokok = tampil;
  KEMBAR.rencana = { lod: rencana.lod, langkah: rencana.langkah, total: semua.length, tampil: tampil.length };
  if (!tampil.length) { r.minta(); return; }
  var bagian = geometriPokok()[rencana.lod];
  var matBatang = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
  var matDaun = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65, side: THREE.DoubleSide });
  var matBuah = new THREE.MeshStandardMaterial({ color: 0xe65100, roughness: 0.5 });
  var dummy = new THREE.Object3D(), warna = new THREE.Color();
  var sv = pt.skala * 2.4, sh = pt.skala * 1.5;
  var meshes = bagian.map(function (b) {
    var m = new THREE.InstancedMesh(b.g, b.warna ? matDaun : b.buah ? matBuah : matBatang, tampil.length);
    m.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    return { m: m, warna: b.warna };
  });
  tampil.forEach(function (p, i) {
    var pos = pt.ke(p.lng, p.lat, 0), sk = skalaPokok(p);
    dummy.position.copy(pos);
    dummy.rotation.set(p.status === 'Mati' ? 0.25 : 0, hashTeks(p.nomor) * Math.PI * 2, 0);
    dummy.scale.set(sh * sk.h, sv * sk.v, sh * sk.h);
    dummy.updateMatrix();
    warna.set(WARNA_STATUS_POKOK[p.status] || '#16a34a');
    meshes.forEach(function (x) { x.m.setMatrixAt(i, dummy.matrix); if (x.warna) x.m.setColorAt(i, warna); });
  });
  meshes.forEach(function (x) {
    x.m.instanceMatrix.needsUpdate = true;
    if (x.m.instanceColor) x.m.instanceColor.needsUpdate = true;
    // r128 belum punya InstancedMesh.computeBoundingSphere: bola batas geometri tunggal ada di titik asal,
    // sehingga seluruh kebun ikut terpangkas saat titik asal keluar layar. Matikan pemangkasan frustum.
    x.m.frustumCulled = false;
    KEMBAR.grup.add(x.m); KEMBAR.mesh.push(x.m);
  });
  var hud = $('#hud-kembar');
  if (hud) hud.textContent = angka(tampil.length) + ' dari ' + angka(semua.length) + ' pokok • LOD ' + rencana.lod + (rencana.langkah > 1 ? ' • 1:' + rencana.langkah : '') + ' • ' + angka(tampil.length * trisLod(rencana.lod)) + ' segitiga';
  r.minta();
}

function fokuskanBlok(id) {
  var b = blokDariId(id); if (!b || !KEMBAR.ruang || !b.batas) return;
  S.tiga.fokusBlok = id;
  if (S.tiga.isolasi === undefined) S.tiga.isolasi = true;
  var kb = kotakBatas(b.batas[0]);
  var c = KEMBAR.peta.ke((kb.minLng + kb.maxLng) / 2, (kb.minLat + kb.maxLat) / 2);
  var lebar = Math.max(jarakM([kb.minLng, kb.minLat], [kb.maxLng, kb.minLat]), jarakM([kb.minLng, kb.minLat], [kb.minLng, kb.maxLat])) * KEMBAR.peta.skala;
  bangunInfra(); bangunPokok(); panelKembar();
  KEMBAR.ruang.kendali.mulaiDari(Math.max(20, lebar * 1.3), 0.5, 0.9, c);
}

function pasangKlikKembar(dom) {
  var ray = new THREE.Raycaster(), m = new THREE.Vector2(), turun = null;
  dom.addEventListener('pointerdown', function (e) { turun = { x: e.clientX, y: e.clientY }; });
  dom.addEventListener('pointerup', function (e) {
    if (!turun || Math.abs(e.clientX - turun.x) + Math.abs(e.clientY - turun.y) > 6) return;
    var r = KEMBAR.ruang; if (!r) return;
    var b = dom.getBoundingClientRect();
    m.x = (e.clientX - b.left) / b.width * 2 - 1; m.y = -((e.clientY - b.top) / b.height) * 2 + 1;
    ray.setFromCamera(m, r.kamera);
    var hit = ray.intersectObjects(KEMBAR.mesh, false)[0];
    if (hit && hit.instanceId !== undefined && KEMBAR.pokok[hit.instanceId]) {
      KEMBAR.pilihan = KEMBAR.pokok[hit.instanceId];
      tandaiPokok(KEMBAR.pilihan);
      if (!$('#panelKembar')) panelKembar(); else tampilkanInfoPokok(KEMBAR.pilihan);
    }
  });
}

function tandaiPokok(p) {
  var r = KEMBAR.ruang;
  if (KEMBAR.penanda) { r.scene.remove(KEMBAR.penanda); buangObjek(KEMBAR.penanda); }
  var pos = KEMBAR.peta.ke(p.lng, p.lat, 0.15);
  var g = new THREE.RingGeometry(0.5, 0.75, 32); g.rotateX(-Math.PI / 2);
  KEMBAR.penanda = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x22d3ee, side: THREE.DoubleSide }));
  KEMBAR.penanda.position.copy(pos);
  r.scene.add(KEMBAR.penanda); r.minta();
}

/* ---- 09-hologram.js ---- */
/* =====================================================================
 * 09-hologram.js - Visualisasi hologram sci-fi: shader GLSL (Fresnel, scanline,
 *                  kedip), pedestal proyektor, kartu telemetri melayang,
 *                  pokok holografik, gestur kamera (optical flow) & putar otomatis
 * ===================================================================== */
var HOLO = { ruang: null, akar: null, mat: [], pedestal: null, telemetri: null, peta: null, kotakBlok: [], gestur: null, putar: 0 };
var PALET_HOLO = {
  CYAN: { nama: 'Cyan Sci-Fi', u: 0x00f0ff, g: 0x00f0ff },
  NEON_GREEN: { nama: 'Hijau Neon (Agronomi)', u: 0x39ff14, g: 0x22c55e },
  AMBER: { nama: 'Amber Taktis (Waspada)', u: 0xffb700, g: 0xf59e0b },
  CRIMSON: { nama: 'Merah Bahaya (Kritis)', u: 0xff003c, g: 0xf43f5e }
};

var HOLO_VS = 'varying vec3 vN; varying vec3 vP; varying vec3 vV;\n' +
  'void main(){ vN = normalize(normalMatrix * normal);\n' +
  '#ifdef USE_INSTANCING\n vec4 wp = instanceMatrix * vec4(position,1.0);\n#else\n vec4 wp = vec4(position,1.0);\n#endif\n' +
  ' vP = (modelMatrix * wp).xyz; vec4 mv = modelViewMatrix * wp; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }';
var HOLO_FS = 'uniform float uWaktu; uniform vec3 uWarna; uniform vec3 uPijar; uniform float uFrek; uniform float uLaju; uniform float uPijarKuat; uniform float uKedip; uniform float uOpas;\n' +
  'varying vec3 vN; varying vec3 vP; varying vec3 vV;\n' +
  'float acak(vec2 s){ return fract(sin(dot(s, vec2(12.9898,78.233))) * 43758.5453); }\n' +
  'void main(){ vec3 n = normalize(vN); vec3 v = normalize(vV);\n' +
  ' float fres = pow(1.0 - max(dot(n, v), 0.0), 2.5) * uPijarKuat;\n' +
  ' float scan = pow((sin(vP.y * uFrek - uWaktu * uLaju * 10.0) + 1.0) * 0.5, 1.8);\n' +
  ' float kedip = 1.0 - sin(uWaktu * 45.0) * cos(uWaktu * 30.0) * uKedip * 0.08;\n' +
  ' if (acak(vec2(floor(uWaktu * 12.0), 0.0)) > 0.96) kedip -= 0.15 * uKedip;\n' +
  ' float pudar = clamp(1.0 - vP.y * 0.012, 0.35, 1.0);\n' +
  ' vec3 w = mix(uWarna, uPijar, fres * 0.6);\n' +
  ' float a = (fres + scan * 0.45 + 0.15) * uOpas * kedip * pudar;\n' +
  ' gl_FragColor = vec4(w, clamp(a, 0.05, 0.95)); }';

function materialHolo(palet, opas, frek) {
  var p = PALET_HOLO[palet] || PALET_HOLO.CYAN;
  var m = new THREE.ShaderMaterial({
    vertexShader: HOLO_VS, fragmentShader: HOLO_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uWaktu: { value: 0 }, uWarna: { value: new THREE.Color(p.u) }, uPijar: { value: new THREE.Color(p.g) }, uFrek: { value: frek || 2.2 },
      uLaju: { value: S.tiga.scan }, uPijarKuat: { value: S.tiga.glow }, uKedip: { value: 0.8 }, uOpas: { value: opas || 0.8 } }
  });
  HOLO.mat.push(m); // SEMUA material didaftar - versi asli menimpa daftar sehingga pokok berhenti beranimasi saat palet diganti.
  return m;
}

PENANGAN_TAB.hologram = {
  buka: function (w) {
    if (HOLO.ruang && document.getElementById('kanvas-hologram')) { HOLO.ruang.ubahUkuran(); HOLO.ruang.animasi = true; return; }
    if (!cekWebgl()) { w.innerHTML = '<div class="muat3d"><div class="kartu">Perangkat/peramban ini tidak mendukung WebGL.</div></div>'; return; }
    siapkanTab3D(w, 'hologram', 'Menyalakan proyektor hologram…').then(function (k) {
      HOLO.ruang = new Ruang3D(k, { latar: 0x02050b, kabut: 0.002, animasi: true });
      var sc = HOLO.ruang.scene;
      sc.add(new THREE.AmbientLight(0x00f0ff, 0.6));
      var bawah = new THREE.PointLight(0x00f0ff, 2.0, 300); bawah.position.set(0, -5, 0); sc.add(bawah);
      HOLO.akar = new THREE.Group(); sc.add(HOLO.akar);
      HOLO.ruang.kendali.mulaiDari(175, 0, 0.9, new THREE.Vector3(0, 12, 0));
      HOLO.ruang.saatFrame = frameHolo;
      bangunHolo();
      tombolHolo();
      if (!document.body.classList.contains('ponsel')) panelHolo(); // di ponsel panel dibuka lewat 🎛️ agar tidak menutupi 3D
      pasangKlikHolo(k);
    }).catch(function (e) { console.error('[3D]', e); });
  },
  gambar: function () { if (HOLO.ruang) { bangunHolo(); panelHolo(); } },
  ubahUkuran: function () { if (HOLO.ruang) HOLO.ruang.ubahUkuran(); },
  tutup: function () {
    hentikanGestur();
    if (HOLO.ruang) { HOLO.ruang.buang(); HOLO.ruang = null; HOLO.mat = []; HOLO.pedestal = null; HOLO.telemetri = null; }
  }
};

function frameHolo(t) {
  HOLO.mat.forEach(function (m) { m.uniforms.uWaktu.value = t; });
  if (HOLO.pedestal) HOLO.pedestal.perbarui(t);
  if (HOLO.telemetri) HOLO.telemetri.perbarui(t, HOLO.ruang.kamera.position);
  var g = HOLO.gestur;
  var rot = HOLO.putar * 0.004;
  if (g && g.aktif && Math.abs(g.vx) > 0.02) rot += g.vx * 0.03 * S.tiga.sensitivitas;
  if (g && g.aktif && g.dekat > 0.3) HOLO.ruang.kendali.r = Math.max(HOLO.ruang.kendali.minR, HOLO.ruang.kendali.r * 0.995), HOLO.ruang.kendali.terapkan();
  if (rot) HOLO.akar.rotation.y += rot;
  if (g && g.aktif) { var el = $('#statusGestur'); if (el && t - (HOLO._tLabel || 0) > 0.2) { el.textContent = g.label || 'Menunggu gerakan tangan…'; HOLO._tLabel = t; } }
}

function bangunHolo() {
  var r = HOLO.ruang; if (!r) return;
  var t = S.tiga, dem = demKebun();
  kosongkanGrup(HOLO.akar);
  if (HOLO.pedestal) { r.scene.remove(HOLO.pedestal.grup); buangObjek(HOLO.pedestal.grup); HOLO.pedestal = null; }
  HOLO.mat = [];
  HOLO.peta = pemetaDunia(dem, t.eksagerasi);
  var geo = geometriTerrain(dem, HOLO.peta);
  HOLO.akar.add(new THREE.Mesh(geo, materialHolo(t.palet, 0.85)));
  HOLO.akar.add(new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({ color: PALET_HOLO[t.palet].u, wireframe: true, transparent: true, opacity: 0.12 })));
  // Kotak blok tak terlihat untuk dipilih (versi asli menerima onSelectBlock tapi tidak pernah memanggilnya).
  HOLO.kotakBlok = [];
  blokAktif().forEach(function (b) {
    if (!b.batas) return;
    var rp = statReplanting(b);
    HOLO.akar.add(garisDiTerrain(b.batas[0], HOLO.peta, rp.skor >= 70 ? 0xff003c : PALET_HOLO[t.palet].u, 0.8));
    var bentuk = new THREE.Shape();
    b.batas[0].forEach(function (p, i) { var v = HOLO.peta.ke(p[0], p[1]); if (i) bentuk.lineTo(v.x, v.z); else bentuk.moveTo(v.x, v.z); });
    var sg = new THREE.ShapeGeometry(bentuk); sg.rotateX(Math.PI / 2);
    var c = HOLO.peta.ke(b.pusatLng || b.batas[0][0][0], b.pusatLat || b.batas[0][0][1]);
    sg.translate(0, c.y + 0.5, 0);
    var m = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));
    m.userData.blokId = b.id;
    HOLO.akar.add(m); HOLO.kotakBlok.push(m);
  });
  if (t.pohon) {
    var semua = [];
    blokAktif().forEach(function (b) { Array.prototype.push.apply(semua, pokokBlok(b, KEMBAR.sensus)); });
    var langkah = Math.max(1, Math.ceil(semua.length / (infoPerangkat().ponsel ? 12000 : 40000)));
    var tampil = semua.filter(function (p, i) { return i % langkah === 0; });
    var g2 = geometriPokok()[2][1].g;
    var im = new THREE.InstancedMesh(g2, materialHolo(t.palet, 0.75, 4.0), tampil.length);
    var d = new THREE.Object3D(), sv = HOLO.peta.skala * 2.4, sh = HOLO.peta.skala * 1.6;
    tampil.forEach(function (p, i) { var s = skalaPokok(p); d.position.copy(HOLO.peta.ke(p.lng, p.lat)); d.scale.set(sh * s.h, sv * s.v, sh * s.h); d.updateMatrix(); im.setMatrixAt(i, d.matrix); });
    im.instanceMatrix.needsUpdate = true;
    im.frustumCulled = false;
    HOLO.akar.add(im);
  }
  if (t.pedestal) { HOLO.pedestal = pedestalHolo(Math.max(HOLO.peta.W, HOLO.peta.D)); r.scene.add(HOLO.pedestal.grup); }
  HOLO.telemetri = t.telemetri ? telemetriHolo() : null;
  if (HOLO.telemetri) HOLO.akar.add(HOLO.telemetri.grup);
}

function pedestalHolo(ukuran) {
  var g = new THREE.Group(), r = ukuran * 0.68, dasar = -6;
  var ped = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.08, 12, 48), new THREE.MeshStandardMaterial({ color: 0x001122, roughness: 0.3, metalness: 0.85 }));
  ped.position.y = dasar - 6; g.add(ped);
  var cincin1 = new THREE.Mesh(new THREE.RingGeometry(r * 0.68, r * 0.7, 64), new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
  cincin1.rotation.x = -Math.PI / 2; cincin1.position.y = dasar + 0.1; g.add(cincin1);
  var cincin2 = new THREE.Mesh(new THREE.RingGeometry(r * 0.88, r * 0.9, 64), new THREE.MeshBasicMaterial({ color: 0x39ff14, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
  cincin2.rotation.x = -Math.PI / 2; cincin2.position.y = dasar + 0.1; g.add(cincin2);
  var kerMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
  var ker = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.92, r * 0.48, 45, 48, 1, true), kerMat);
  ker.position.y = dasar + 18; g.add(ker);
  var j = r * 0.76;
  [[-j, -j], [j, -j], [-j, j], [j, j]].forEach(function (p) {
    var tiang = new THREE.Mesh(new THREE.BoxGeometry(6, 14, 6), new THREE.MeshStandardMaterial({ color: 0x001a33, metalness: 0.9, roughness: 0.2 }));
    tiang.position.set(p[0], dasar + 4, p[1]); g.add(tiang);
    var ujung = new THREE.Mesh(new THREE.SphereGeometry(1.4, 12, 12), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
    ujung.position.set(p[0], dasar + 11.5, p[1]); g.add(ujung);
    var las = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p[0], dasar + 11.5, p[1]), new THREE.Vector3(p[0] * 0.45, 15, p[1] * 0.45)]),
      new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending }));
    g.add(las);
  });
  var kisi = new THREE.GridHelper(ukuran * 1.2, 24, 0x00f0ff, 0x002244); kisi.position.y = dasar; g.add(kisi);
  return { grup: g, perbarui: function (t) { cincin1.rotation.z = t * 0.15; cincin2.rotation.z = -t * 0.1; kerMat.opacity = 0.1 + Math.sin(t * 2.5) * 0.03; } };
}

/** Kartu telemetri melayang untuk blok yang PALING perlu perhatian (bukan 4 kode blok dipatok). */
function telemetriHolo() {
  var g = new THREE.Group(), kartu = [];
  var kandidat = blokAktif().filter(function (b) { return b.batas; }).map(function (b) {
    var rp = statReplanting(b), bj = statBanjir(b), skor = rp.skor + (bj.risiko !== 'Rendah' ? 30 : 0) + (Number(b.ganodermaPct) || 0) * 3;
    return { b: b, skor: skor, rp: rp, bj: bj };
  }).sort(function (a, b) { return b.skor - a.skor; }).slice(0, infoPerangkat().ponsel ? 4 : 6);
  kandidat.forEach(function (k) {
    var b = k.b, waspada = k.rp.skor >= 45 || k.bj.risiko !== 'Rendah';
    var dasar = HOLO.peta.ke(b.pusatLng, b.pusatLat), tinggi = dasar.y + 22;
    var warna = waspada ? 0xff003c : 0x00f0ff;
    var garis = new THREE.Line(new THREE.BufferGeometry().setFromPoints([dasar, new THREE.Vector3(dasar.x, tinggi - 2.5, dasar.z)]),
      new THREE.LineDashedMaterial({ color: warna, dashSize: 1.5, gapSize: 0.8, transparent: true, opacity: 0.85 }));
    garis.computeLineDistances(); g.add(garis);
    var riak = new THREE.Mesh(new THREE.RingGeometry(2.5, 3.2, 24), new THREE.MeshBasicMaterial({ color: warna, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
    riak.rotation.x = -Math.PI / 2; riak.position.set(dasar.x, dasar.y + 0.2, dasar.z); g.add(riak);
    var c = document.createElement('canvas'); c.width = 384; c.height = 192;
    var x = c.getContext('2d'), h = waspada ? '#ff003c' : '#00f0ff';
    x.fillStyle = 'rgba(0,17,34,0.88)'; x.fillRect(4, 4, 376, 184); x.strokeStyle = h; x.lineWidth = 4; x.strokeRect(4, 4, 376, 184);
    x.fillStyle = h; x.font = 'bold 24px monospace'; x.fillText('BLOK ' + b.kode, 20, 40);
    x.fillStyle = '#94a3b8'; x.font = '15px monospace'; x.fillText(namaAfdeling(b.afdelingId).slice(0, 30), 20, 64);
    x.fillStyle = '#e2e8f0'; x.font = '16px monospace';
    x.fillText('Luas : ' + angka(b.luasTanamHa, 1) + ' ha  Umur ' + angka(umurBlok(b)) + ' th', 20, 98);
    x.fillText('Prod : ' + angka(b.produksiTonHa, 1) + ' t/ha  NDVI ' + angka(b.ndvi, 2), 20, 124);
    x.fillStyle = waspada ? '#f87171' : '#34d399'; x.font = 'bold 16px monospace';
    x.fillText(k.rp.skor >= 45 ? 'REPLANTING: ' + k.rp.prioritas.toUpperCase() : k.bj.risiko !== 'Rendah' ? 'AIR: ' + k.bj.risiko.toUpperCase() : 'STATUS: PRIMA', 20, 160);
    var tex = new THREE.CanvasTexture(c);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.92, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.set(dasar.x, tinggi, dasar.z); g.add(m);
    kartu.push({ m: m, y0: tinggi, fase: hashTeks(b.kode) * Math.PI * 2 });
  });
  return { grup: g, perbarui: function (t, posKamera) {
    kartu.forEach(function (k) {
      k.m.position.y = k.y0 + Math.sin(t * 2 + k.fase) * 0.45;
      // lookAt memakai koordinat DUNIA (sudah memperhitungkan rotasi induk); sumbu putar hanya Y jadi tinggi lokal = tinggi dunia.
      k.m.lookAt(posKamera.x, k.m.position.y, posKamera.z);
    });
  } };
}

function tombolHolo() {
  $('#tombol-hologram').innerHTML = '<button class="tbl ikon" id="hPanel" title="Kendali">🎛️</button><button class="tbl ikon" id="hReset" title="Atur ulang">🎯</button><button class="tbl ikon" id="hPenuh" title="Layar penuh">⛶</button>';

function pasangKlikHolo(dom) {
  var ray = new THREE.Raycaster(), m = new THREE.Vector2(), turun = null;
  dom.addEventListener('pointerdown', function (e) { turun = { x: e.clientX, y: e.clientY }; });
  dom.addEventListener('pointerup', function (e) {
    if (!turun || Math.abs(e.clientX - turun.x) + Math.abs(e.clientY - turun.y) > 6 || !HOLO.ruang) return;
    var b = dom.getBoundingClientRect();
    m.x = (e.clientX - b.left) / b.width * 2 - 1; m.y = -((e.clientY - b.top) / b.height) * 2 + 1;
    ray.setFromCamera(m, HOLO.ruang.kamera);
    var hit = ray.intersectObjects(HOLO.kotakBlok, false)[0];
    if (!hit) return;
    var bl = blokDariId(hit.object.userData.blokId);
    if (!$('#panelHolo')) panelHolo();
    var rp = statReplanting(bl), pr = statProduksi(bl), nd = statNdvi(bl);
    $('#infoBlokHolo').innerHTML = '<div class="kartu" style="margin-top:10px;padding:10px"><b>Blok ' + esc(bl.kode) + '</b> <span class="redup">' + esc(namaAfdeling(bl.afdelingId)) + '</span>' +
      '<div class="kisi k2" style="margin-top:6px"><div class="stat"><span>Produksi</span><b>' + angka(bl.produksiTonHa, 1) + '</b><small>' + esc(pr.kinerja) + '</small></div>' +
      '<div class="stat"><span>NDVI</span><b>' + angka(bl.ndvi, 2) + '</b><small>' + esc(nd.kategori) + '</small></div></div>' +
      '<p class="kecilTeks">♻️ ' + esc(rp.prioritas) + ' (skor ' + rp.skor + ')</p><button class="tbl kecil" onclick="S.peta.blokId=null;bukaTab(\'peta\');setTimeout(function(){pilihBlok(\'' + esc(bl.id) + '\',true)},200)">Buka di peta</button></div>';
  });
}

// ------------------------------------------------------------------ gestur kamera (optical flow sederhana)
function mulaiGestur() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Kamera tidak didukung peramban ini.', 'galat'); return; }
  navigator.mediaDevices.getUserMedia({ video: { width: 160, height: 120, facingMode: 'user', frameRate: { ideal: 20 } }, audio: false }).then(function (aliran) {
    var v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.autoplay = true; v.srcObject = aliran;
    v.style.cssText = 'position:absolute;right:12px;bottom:12px;width:128px;height:96px;border-radius:12px;border:1px solid rgba(34,211,238,.5);object-fit:cover;z-index:810;transform:scaleX(-1)';
    wadahTab('hologram').appendChild(v);
    v.play().catch(function () {});
    var c = document.createElement('canvas'); c.width = 40; c.height = 30;
    var ctx = c.getContext('2d', { willReadFrequently: true });
    var g = { aktif: true, aliran: aliran, video: v, sebelum: null, cxSebelum: null, vx: 0, dekat: 0, label: '' };
    g.selang = setInterval(function () {
      if (!g.aktif || v.readyState < 2) return;
      ctx.drawImage(v, 0, 0, 40, 30);
      var d = ctx.getImageData(0, 0, 40, 30).data;
      if (!g.sebelum) { g.sebelum = new Uint8ClampedArray(d); return; }
      var n = 0, sx = 0;
      for (var i = 0, p = 0; i < d.length; i += 4, p++) {
        var lum = (d[i] + d[i + 1] + d[i + 2]) / 3, lumL = (g.sebelum[i] + g.sebelum[i + 1] + g.sebelum[i + 2]) / 3;
        if (Math.abs(lum - lumL) > 30) { n++; sx += p % 40; }
      }
      g.sebelum.set(d);
      g.dekat = n / 1200;
      if (n > 25) {
        var cx = -((sx / n) / 40 * 2 - 1); // dicerminkan
        // Kecepatan = PERPINDAHAN pusat gerakan antar-frame (versi asli memakai posisi, bukan kecepatan).
        if (g.cxSebelum !== null) g.vx = g.vx * 0.6 + (cx - g.cxSebelum) * 4 * 0.4;
        g.cxSebelum = cx;
        g.label = g.vx < -0.15 ? '⟲ PUTAR KIRI' : g.vx > 0.15 ? '⟳ PUTAR KANAN' : g.dekat > 0.3 ? '🔍 MENDEKAT' : 'GERAKAN TERDETEKSI';
      } else { g.vx *= 0.5; g.cxSebelum = null; g.label = 'Menunggu gerakan tangan…'; }
    }, 60);
    HOLO.gestur = g;
    panelHolo();
  }).catch(function (e) {
    toast('Kamera tidak dapat diaktifkan: ' + (e.name === 'NotAllowedError' ? 'izin ditolak.' : e.message) + (S.mode === 'gas' ? ' Di mode Apps Script akses kamera sering diblokir bingkai Google - pakai versi PWA.' : ''), 'galat', 7000);
  });
}
function hentikanGestur() {
  var g = HOLO.gestur; if (!g) return;
  g.aktif = false; clearInterval(g.selang);
  g.aliran.getTracks().forEach(function (t) { t.stop(); });
  if (g.video) g.video.remove();
  HOLO.gestur = null;
}

// ------------------------------------------------------------------ grafik kanvas (tanpa pustaka)
function kanvasGrafik(id, tinggi) {
  return '<canvas class="grafik" id="' + id + '" height="' + (tinggi || 220) + '" style="height:' + (tinggi || 220) + 'px"></canvas>';
}
function siapKanvas(c) {
  var dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth || 300, h = c.clientHeight || 200;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  return { x: x, w: w, h: h };
}
/** Grafik garis: seri = [{nama, warna, titik:[[t(ms), v], ...]}], opsi: {pita:[bawah, atas], satuan, terbalik} */
function grafikGaris(c, seri, opsi) {
  if (!c) return;
  opsi = opsi || {};
  var k = siapKanvas(c), x = k.x, kiri = 44, kanan = 10, atas = 12, bawah = 26, W = k.w - kiri - kanan, H = k.h - atas - bawah;
  var semua = []; seri.forEach(function (s) { s.titik.forEach(function (p) { semua.push(p); }); });
  if (!semua.length) { x.fillStyle = '#64748b'; x.font = '12px sans-serif'; x.fillText('Belum ada data', kiri, atas + 20); return; }
  var t0 = Math.min.apply(null, semua.map(function (p) { return p[0]; })), t1 = Math.max.apply(null, semua.map(function (p) { return p[0]; }));
  var v = semua.map(function (p) { return p[1]; });
  if (opsi.pita) v = v.concat(opsi.pita);
  var v0 = Math.min.apply(null, v), v1 = Math.max.apply(null, v), pad = (v1 - v0) * 0.1 || 1; v0 -= pad; v1 += pad;
  var X = function (t) { return kiri + (t1 === t0 ? W / 2 : (t - t0) / (t1 - t0) * W); }, Y = function (val) { return atas + (1 - (val - v0) / (v1 - v0)) * H; };
  x.font = '10px ' + 'ui-monospace,monospace'; x.fillStyle = '#64748b'; x.strokeStyle = '#1e2a44'; x.lineWidth = 1;
  for (var i = 0; i <= 4; i++) { var yy = atas + i * H / 4, val = v1 - i * (v1 - v0) / 4; x.beginPath(); x.moveTo(kiri, yy); x.lineTo(kiri + W, yy); x.stroke(); x.fillText(angka(val, Math.abs(v1 - v0) < 10 ? 1 : 0), 2, yy + 3); }
  if (opsi.pita) {
    x.fillStyle = 'rgba(16,185,129,0.10)'; x.fillRect(kiri, Y(opsi.pita[1]), W, Y(opsi.pita[0]) - Y(opsi.pita[1]));
    x.setLineDash([5, 4]); x.strokeStyle = 'rgba(16,185,129,.7)';
    opsi.pita.forEach(function (p) { x.beginPath(); x.moveTo(kiri, Y(p)); x.lineTo(kiri + W, Y(p)); x.stroke(); });
    x.setLineDash([]);
  }
  var rentangJam = (t1 - t0) / 3600000;
  for (var j = 0; j <= 4; j++) {
    var tt = t0 + j * (t1 - t0) / 4, d = new Date(tt);
    x.fillStyle = '#64748b';
    x.fillText(rentangJam > 48 ? d.getDate() + ' ' + BULAN[d.getMonth()] : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2), X(tt) - 14, k.h - 8);
  }
  seri.forEach(function (s) {
    x.strokeStyle = s.warna || '#22d3ee'; x.lineWidth = 2; x.beginPath();
    s.titik.forEach(function (p, i) { if (i) x.lineTo(X(p[0]), Y(p[1])); else x.moveTo(X(p[0]), Y(p[1])); });
    x.stroke();
    var akhir = s.titik[s.titik.length - 1];
    if (akhir) { x.fillStyle = s.warna || '#22d3ee'; x.beginPath(); x.arc(X(akhir[0]), Y(akhir[1]), 3.5, 0, Math.PI * 2); x.fill(); }
  });
}
/** Grafik batang berkelompok: label[], seri=[{nama,warna,nilai[]}] */
function grafikBatang(c, label, seri, opsi) {
  if (!c) return;
  opsi = opsi || {};
  var k = siapKanvas(c), x = k.x, kiri = 46, kanan = 8, atas = 10, bawah = 26, W = k.w - kiri - kanan, H = k.h - atas - bawah;
  var maks = 0; seri.forEach(function (s) { s.nilai.forEach(function (v) { maks = Math.max(maks, v || 0); }); });
  if (opsi.garis) opsi.garis.nilai.forEach(function (v) { maks = Math.max(maks, v || 0); });
  maks = maks || 1;
  x.font = '10px ui-monospace,monospace'; x.strokeStyle = '#1e2a44';
  for (var i = 0; i <= 4; i++) { var yy = atas + i * H / 4; x.beginPath(); x.moveTo(kiri, yy); x.lineTo(kiri + W, yy); x.stroke(); x.fillStyle = '#64748b'; x.fillText(angka(maks * (1 - i / 4), maks < 10 ? 1 : 0), 2, yy + 3); }
  var n = label.length, gw = W / n, bw = Math.max(2, (gw * 0.75) / seri.length);
  label.forEach(function (l, i) {
    seri.forEach(function (s, j) {
      var v = s.nilai[i] || 0, h = v / maks * H;
      x.fillStyle = s.warna; x.fillRect(kiri + i * gw + gw * 0.125 + j * bw, atas + H - h, bw - 1, h);
    });
    if (n <= 16 || i % Math.ceil(n / 12) === 0) { x.fillStyle = '#94a3b8'; x.fillText(String(l).slice(0, 6), kiri + i * gw + 2, k.h - 8); }
  });
  if (opsi.garis) {
    x.strokeStyle = opsi.garis.warna || '#f59e0b'; x.lineWidth = 2; x.setLineDash([5, 3]); x.beginPath();
    opsi.garis.nilai.forEach(function (v, i) { var px = kiri + i * gw + gw / 2, py = atas + H - (v || 0) / maks * H; if (i) x.lineTo(px, py); else x.moveTo(px, py); });
    x.stroke(); x.setLineDash([]);
  }
}

// ------------------------------------------------------------------ status
function statusSensor(s) {
  var basi = s.terakhirKirim && Date.now() - new Date(s.terakhirKirim).getTime() > 6 * 3600000;
  if (!s.aktif) return { kode: 'NONAKTIF', label: 'Nonaktif', warna: '#64748b' };
  if (basi) return { kode: 'DIAM', label: 'Tidak mengirim > 6 jam', warna: '#a855f7' };
  if (s.jenis === 'Piezometer' && s.nilaiTerakhir !== null && s.nilaiTerakhir !== undefined) {
    var v = Number(s.nilaiTerakhir), atas = pengaturanAngka('airBatasAtasCm', -40), bawah = pengaturanAngka('airBatasBawahCm', -60);
    if (v > atas) return { kode: 'GENANGAN', label: 'Terlalu basah (> ' + atas + ' cm)', warna: '#38bdf8' };
    if (v < bawah) return { kode: 'KERING', label: 'Kering - rawan api (< ' + bawah + ' cm)', warna: '#ef4444' };
    return { kode: 'AMAN', label: 'Dalam rentang target', warna: '#22c55e' };
  }
  if (s.baterai !== null && s.baterai < 20) return { kode: 'BATERAI', label: 'Baterai lemah', warna: '#f59e0b' };
  return { kode: 'AMAN', label: 'Normal', warna: '#22c55e' };
}

function daftarPeringatan() {
  var out = [];
  daftarLingkup('sensor').forEach(function (s) {
    var st = statusSensor(s);
    if (st.kode === 'KERING') out.push({ tingkat: 'KRITIS', judul: 'Gambut kering: ' + s.kode, pesan: s.nama + ' ' + angka(s.nilaiTerakhir) + ' cm. Tutup sekat/pintu hilir agar air tertahan; siagakan regu damkar.', id: s.id });
    if (st.kode === 'GENANGAN') out.push({ tingkat: 'WASPADA', judul: 'Muka air tinggi: ' + s.kode, pesan: s.nama + ' ' + angka(s.nilaiTerakhir) + ' cm. Buka pintu pembuangan bertahap; periksa sumbatan kanal.', id: s.id });
    if (st.kode === 'DIAM') out.push({ tingkat: 'INFO', judul: 'Sensor diam: ' + s.kode, pesan: 'Terakhir mengirim ' + relatif(s.terakhirKirim) + '. Periksa baterai / sinyal LoRa.', id: s.id });
    if (s.baterai !== null && s.baterai < 20) out.push({ tingkat: 'INFO', judul: 'Baterai lemah: ' + s.kode, pesan: 'Sisa ' + angka(s.baterai) + '%.', id: s.id });
  });
  var cuaca = Simpan.ambil(KUNCI.cuaca, null);
  if (cuaca && cuaca.fdrs && (cuaca.fdrs.tingkat === 'TINGGI' || cuaca.fdrs.tingkat === 'EKSTREM')) {
    out.push({ tingkat: 'KRITIS', judul: 'Bahaya kebakaran ' + cuaca.fdrs.tingkat, pesan: 'Indeks ' + cuaca.fdrs.skor + '. Patroli api, tahan air di kanal, larang pembakaran.' });
  }
  return out;
}

/** Rekomendasi pintu air berbasis aturan sederhana dari sensor + prakiraan hujan. */
function rekomendasiPintu() {
  var cuaca = Simpan.ambil(KUNCI.cuaca, null), rek = [];
  var hujan3 = cuaca && cuaca.harian ? (cuaca.harian.precipitation_sum || []).filter(function (_, i) { return cuaca.harian.time[i] > hariIni(); }).slice(0, 3).reduce(function (a, b) { return a + (b || 0); }, 0) : null;
  var kering = daftarLingkup('sensor').filter(function (s) { return statusSensor(s).kode === 'KERING'; });
  var basah = daftarLingkup('sensor').filter(function (s) { return statusSensor(s).kode === 'GENANGAN'; });
  daftarLingkup('pintuAir').forEach(function (p) {
    if (kering.length && p.status !== 'Closed') rek.push({ pintu: p, saran: 'Tutup', bukaan: 0, alasan: kering.length + ' piezometer di bawah batas bawah' + (hujan3 !== null ? '; hujan 3 hari ke depan ±' + angka(hujan3, 0) + ' mm' : '') });
    else if (basah.length && !kering.length && (p.bukaanPct || 0) < 60) rek.push({ pintu: p, saran: 'Buka sebagian', bukaan: hujan3 > 40 ? 80 : 50, alasan: basah.length + ' piezometer terlalu basah' + (hujan3 !== null ? '; prakiraan hujan ±' + angka(hujan3, 0) + ' mm/3 hari' : '') });
  });
  return { daftar: rek, hujan3: hujan3 };
}

var _riwayatSensor = {};
function muatRiwayatSensor(ids, jam) {
  var k = ids.join(',') + '|' + jam;
  if (_riwayatSensor[k] && Date.now() - _riwayatSensor[k].t < 60000) return Promise.resolve(_riwayatSensor[k].d);
  return panggil('telemetri_riwayat', { jam: jam }).then(function (r) { _riwayatSensor[k] = { t: Date.now(), d: r }; return r; })
    .catch(function (e) { toast('Riwayat sensor tidak termuat: ' + e.message, 'galat'); return { seri: {}, batasAtas: -40, batasBawah: -60 }; });
}

function iotSensor(el) {
  var s = daftarLingkup('sensor');
  el.innerHTML = '<div class="kartu"><div class="gulirX"><table class="tabel"><thead><tr><th>Sensor</th><th>Jenis</th><th>Blok</th><th>Nilai</th><th>Status</th><th>Baterai</th><th>Terakhir</th></tr></thead><tbody>' +

function hitungFdrsKlien(hujan24, rh, suhu, hariKering) {
  var s = 0;
  if (!hujan24) s += 30; else if (hujan24 < 5) s += 15;
  if (rh < 55) s += 30; else if (rh < 70) s += 18; else if (rh < 85) s += 8;
  if (suhu > 34) s += 20; else if (suhu > 31) s += 12;
  s += Math.min(20, (hariKering || 0) * 4);
  return { skor: s, tingkat: s >= 75 ? 'EKSTREM' : s >= 50 ? 'TINGGI' : s >= 25 ? 'SEDANG' : 'RENDAH' };
}
function warnaFdrs(t) { return t === 'EKSTREM' || t === 'TINGGI' ? 'merah' : t === 'SEDANG' ? 'kuning' : 'hijau'; }

/* =====================================================================
 * 11-dasbor.js - Dasbor eksekutif: KPI, sebaran umur, produksi bulanan per
 *                afdeling, peringkat blok, replanting, model regresi jujur,
 *                ekspor GeoJSON/CSV/KML, tata letak peta kartografis (PNG/PDF)
 * ===================================================================== */
var DASBOR = { rekap: null };

function hitungKpi() {
  var bl = blokAktif(), k = kebunAktif() || {};
  var tanam = bl.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
  var pokok = bl.reduce(function (s, b) { return s + (Number(b.jumlahPokok) || Math.round((b.sph || 0) * (b.luasTanamHa || 0))); }, 0);
  var tm = bl.filter(function (b) { return umurBlok(b) >= 4; });
  var luasTm = tm.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
  var ton = tm.reduce(function (s, b) { return s + (Number(b.produksiTonHa) || 0) * (Number(b.luasTanamHa) || 0); }, 0);
  var umurBobot = bl.reduce(function (s, b) { return s + (umurBlok(b) || 0) * (Number(b.luasTanamHa) || 0); }, 0);
  var rep = bl.filter(function (b) { return b.kandidatReplanting || statReplanting(b).skor >= 45; });
  var gano = tanam ? bl.reduce(function (s, b) { return s + (Number(b.ganodermaPct) || 0) * (Number(b.luasTanamHa) || 0); }, 0) / tanam : null;
  var gambut = bl.filter(function (b) { return (Number(b.gambutCm) || 0) >= 50; }).reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
  var kelas = [['TBM (< 4 thn)', 0, 3, '#38bdf8'], ['TM muda (4-8)', 4, 8, '#22c55e'], ['TM prima (9-18)', 9, 18, '#15803d'], ['TM tua (19-24)', 19, 24, '#f59e0b'], ['Afkir (≥ 25)', 25, 999, '#ef4444']]
    .map(function (c) {
      var d = bl.filter(function (b) { var u = umurBlok(b); return u >= c[1] && u <= c[2]; });
      var ha = d.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
      return { label: c[0], warna: c[3], blok: d.length, ha: ha, pct: tanam ? ha / tanam * 100 : 0 }; // tanpa NaN bila luas 0
    });
  return { hgu: Number(k.luasHguHa) || null, tanam: tanam, cadangan: k.luasHguHa ? Math.max(0, k.luasHguHa - tanam) : null, blok: bl.length, pokok: pokok,
    sph: tanam ? pokok / tanam : null, yieldTm: luasTm ? ton / luasTm : null, tonTahun: ton, umurRata: tanam ? umurBobot / tanam : null,
    replanting: rep, replantingHa: rep.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0), gano: gano, gambutHa: gambut, mineralHa: tanam - gambut, kelasUmur: kelas, luasTm: luasTm };
}

/** Bandingkan estate dalam lingkup (muncul bila lebih dari satu estate terlihat). */
function perbandinganEstate() {
  var t = kebunTerpilih();
  if (t.length < 2) return '';
  var baris = t.map(function (k) {
    var afd = {}; daftar('afdeling').forEach(function (a) { if (a.kebunId === k.id) afd[a.id] = 1; });
    var bl = blokAktif().filter(function (b) { return afd[b.afdelingId]; });
    var luas = bl.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
    var tm = bl.filter(function (b) { return umurBlok(b) >= 4; }), luasTm = tm.reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
    var ton = tm.reduce(function (s, b) { return s + (Number(b.produksiTonHa) || 0) * (Number(b.luasTanamHa) || 0); }, 0);
    var umur = luas ? bl.reduce(function (s, b) { return s + (umurBlok(b) || 0) * (Number(b.luasTanamHa) || 0); }, 0) / luas : null;
    var rep = bl.filter(function (b) { return b.kandidatReplanting || statReplanting(b).skor >= 45; }).length;
    var gambut = bl.filter(function (b) { return (Number(b.gambutCm) || 0) >= 50; }).reduce(function (s, b) { return s + (Number(b.luasTanamHa) || 0); }, 0);
    return { k: k, blok: bl.length, luas: luas, yieldTm: luasTm ? ton / luasTm : null, ton: ton, umur: umur, rep: rep, gambutPct: luas ? gambut / luas * 100 : null };
  });
  var maks = Math.max.apply(null, baris.map(function (r) { return r.yieldTm || 0; }).concat([1]));
  return '<div class="kartu"><h3>Perbandingan estate</h3><div class="gulirX"><table class="tabel"><thead><tr><th>Estate</th><th>Perusahaan</th><th>Blok</th><th>Luas tanam</th><th>Produktivitas TM</th><th>Produksi/thn</th><th>Umur rata²</th><th>Gambut</th><th>Replanting</th></tr></thead><tbody>' +
    baris.map(function (r) {
      return '<tr class="klik" data-estate="' + esc(r.k.id) + '"><td><b>' + esc(r.k.nama) + '</b></td><td>' + esc(r.k.perusahaan || '–') + '</td><td class="mono">' + r.blok + '</td><td class="mono">' + angka(r.luas, 1) + ' ha</td>' +
        '<td><div class="batang" style="margin:0"><div class="jalur" style="min-width:60px"><div class="isiJalur" style="width:' + ((r.yieldTm || 0) / maks * 100) + '%;background:var(--aksen)"></div></div><span class="nilai">' + angka(r.yieldTm, 1) + '</span></div></td>' +
        '<td class="mono">' + angka(r.ton, 0) + ' t</td><td class="mono">' + angka(r.umur, 1) + '</td><td class="mono">' + persen(r.gambutPct, 0) + '</td><td class="mono">' + r.rep + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="petunjuk">Ketuk baris untuk mempersempit lingkup ke estate itu.</p></div>';
}

function csvBlok() {

  var sel = function (v) { if (v === null || v === undefined) return ''; var s = typeof v === 'number' ? String(v).replace('.', ',') : String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* ---- 12-gps.js ---- */
/* =====================================================================
 * 12-gps.js - GPS lapangan: rekam jejak (watchPosition), saring akurasi,
 *             antrian luring, posisi tim lapangan (polling - Apps Script
 *             tidak mendukung WebSocket), ekspor GPX, kunci layar menyala
 * ===================================================================== */
var GPS = { jaga: null, aktif: false, sesi: null, jejak: [], terakhir: null, akurasiMaks: 25, jarakMin: 3, armada: [], ikuti: null, kunciLayar: null, polling: null, galat: null };

function idPerangkat() {
  var id = Simpan.ambil(KUNCI.perangkat, null);
  if (!id) { id = (S.saya ? S.saya.username : 'hp') + '-' + idLokal('').slice(1, 7); Simpan.taruh(KUNCI.perangkat, id); }
  return id;
}

function mulaiGps() {
  if (!navigator.geolocation) { toast('Perangkat tidak mendukung GPS.', 'galat'); return; }
  if (GPS.aktif) return;
  GPS.aktif = true; GPS.galat = null;
  GPS.sesi = 'SES-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  GPS.jejak = [];
  GPS.jaga = navigator.geolocation.watchPosition(terimaPosisi, function (e) {
    GPS.galat = e.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk aplikasi ini.' : e.message;
    perbaruiPanelGps();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (k) { GPS.kunciLayar = k; }).catch(function () { });
  toast('Perekaman GPS dimulai.', 'ok');
  perbaruiPanelGps();
}

function hentikanGps() {
  if (GPS.jaga !== null) navigator.geolocation.clearWatch(GPS.jaga);
  GPS.jaga = null; GPS.aktif = false;
  if (GPS.kunciLayar) { GPS.kunciLayar.release().catch(function () { }); GPS.kunciLayar = null; }
  if (GPS.jejak.length) { Simpan.taruh(KUNCI.jejakSaya, { sesi: GPS.sesi, titik: GPS.jejak }); }
  sinkronkan(true);
  perbaruiPanelGps();
}

function terimaPosisi(p) {
  var c = p.coords;
  GPS.terakhir = { lat: c.latitude, lng: c.longitude, akurasiM: c.accuracy, kecepatan: c.speed, arah: c.heading, waktu: new Date(p.timestamp || Date.now()).toISOString() };
  if (c.accuracy <= GPS.akurasiMaks) {
    var akhir = GPS.jejak[GPS.jejak.length - 1];
    if (!akhir || jarakM([akhir.lng, akhir.lat], [c.longitude, c.latitude]) >= GPS.jarakMin) {
      var t = { id: idLokal('GPS'), perangkat: idPerangkat(), waktu: GPS.terakhir.waktu, lat: c.latitude, lng: c.longitude, akurasiM: Math.round(c.accuracy * 10) / 10,
        kecepatan: c.speed === null ? '' : Math.round(c.speed * 36) / 10, arah: c.heading === null ? '' : Math.round(c.heading), sesi: GPS.sesi };
      GPS.jejak.push(t);
      var antri = Simpan.ambil(KUNCI.gps, []); antri.push(t); Simpan.taruh(KUNCI.gps, antri.slice(-5000));
      if (GPS.jejak.length % 10 === 0) Simpan.taruh(KUNCI.jejakSaya, { sesi: GPS.sesi, titik: GPS.jejak });
      if (S.online && antri.length >= 20) sinkronkan(true);
      perbaruiChip();
    }
  }
  if (typeof gambarGpsDiPeta === 'function') gambarGpsDiPeta();
  perbaruiPanelGps();
}

function mulaiPollingGps() {
  if (GPS.polling || !fitur('gps')) return;
  var tarik = function () {
    if (!S.token || !S.online || document.hidden) return;
    if (S.tab !== 'peta' && S.tab !== 'gps') return;
    panggil('gps_terkini', { menit: 120 }, { cepat: true }).then(function (r) {
      GPS.armada = r;
      if (GPS.ikuti) { var d = r.filter(function (x) { return x.perangkat === GPS.ikuti; })[0]; if (d && PETA.peta && S.tab === 'peta') PETA.peta.panTo([d.terakhir.lat, d.terakhir.lng]); }
      gambarGpsDiPeta(); perbaruiPanelGps();
    }).catch(function () { });
  };
  tarik();
  GPS.polling = setInterval(tarik, 25000);
}

function gambarGpsDiPeta() {
  if (!PETA.peta || !PETA.grup.gps) return;
  var g = PETA.grup.gps; g.clearLayers();
  if (!S.peta.lapisan.gps) return;
  var saya = idPerangkat();
  GPS.armada.forEach(function (d) {
    if (d.perangkat === saya && GPS.aktif) return;
    if (S.peta.lapisan.jejak && d.jejak.length > 1) L.polyline(d.jejak.map(function (j) { return [j[0], j[1]]; }), { color: '#a78bfa', weight: 2, opacity: 0.7, dashArray: '4 4', interactive: false }).addTo(g);
    var umur = (Date.now() - new Date(d.terakhir.waktu).getTime()) / 60000;
    L.marker([d.terakhir.lat, d.terakhir.lng], { icon: L.divIcon({ className: '', html: '<div class="ikonTitik' + (umur < 5 ? ' denyut' : '') + '" style="width:14px;height:14px;background:' + (umur < 10 ? '#a78bfa' : '#64748b') + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) })
      .bindPopup('<b>' + esc(d.perangkat) + '</b><br>' + esc(d.pengguna) + '<br>' + waktuTeks(d.terakhir.waktu) + ' (' + relatif(d.terakhir.waktu) + ')' + (d.terakhir.kecepatan ? '<br>' + angka(d.terakhir.kecepatan, 1) + ' km/j' : '') + (d.terakhir.akurasiM ? ' • ±' + angka(d.terakhir.akurasiM) + ' m' : '')).addTo(g);
  });
  if (GPS.jejak.length > 1 && S.peta.lapisan.jejak) L.polyline(GPS.jejak.map(function (t) { return [t.lat, t.lng]; }), { color: '#22d3ee', weight: 3, interactive: false }).addTo(g);
  if (GPS.terakhir && GPS.aktif) {
    L.circle([GPS.terakhir.lat, GPS.terakhir.lng], { radius: GPS.terakhir.akurasiM, color: '#22d3ee', weight: 1, fillOpacity: 0.1, interactive: false }).addTo(g);
    L.marker([GPS.terakhir.lat, GPS.terakhir.lng], { interactive: false, icon: L.divIcon({ className: '', html: '<div class="ikonTitik denyut" style="width:16px;height:16px;background:#06b6d4"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(g);
    if (GPS.ikuti === saya && S.tab === 'peta') PETA.peta.panTo([GPS.terakhir.lat, GPS.terakhir.lng]);
  }
}

/** Formulir umum untuk semua lembar. setelah() dipanggil sesudah berhasil simpan. */
function formCatatan(lembar, nilai, setelah) {
  nilai = nilai || {};
  var ruas = RUAS[lembar]();
  var izin = IZIN_LEMBAR_KLIEN[lembar];
  var bisa = bolehUbah(izin);
  var lama = nilai.id ? true : false;
  var tambahan = lembar === 'Panen' ? '<div id="fRingkasPanen" class="infoKotak sembunyi" style="margin-top:6px"></div>' : '';
  modalBuka((lama ? 'Ubah ' : 'Tambah ') + JUDUL_LEMBAR[lembar].toLowerCase(), (bisa ? '' : '<div class="peringatanKotak" style="margin-bottom:10px">' + (modePembaca() ? 'Mode pembaca - perubahan dikunci.' : 'Peran Anda tidak memiliki izin ' + izin + '.') + '</div>') +
    '<div class="kisi k2">' + bentukRuas(ruas.map(function (r) { return bisa ? r : Object.assign({}, r, { baca: true }); }), nilai) + '</div>' + tambahan,
    (lama && bisa ? '<button class="tbl bahaya" id="fHapus">Hapus</button>' : '') + '<button class="tbl" onclick="modalTutup()">Tutup</button>' + (bisa ? '<button class="tbl utama" id="fSimpan">Simpan</button>' : ''), { lebar: ruas.length > 10 });
  if (lembar === 'Panen') {
    var hitung = function () {
      var j = Number($('#f_janjang').value), k = Number($('#f_beratKg').value), el = $('#fRingkasPanen');
      if (j > 0 && k > 0) { el.classList.remove('sembunyi'); el.textContent = 'BJR ' + angka(k / j, 1) + ' kg/janjang • ' + angka(k / 1000, 2) + ' ton'; } else el.classList.add('sembunyi');
    };
    ['f_janjang', 'f_beratKg'].forEach(function (i) { var e = document.getElementById(i); if (e) e.addEventListener('input', hitung); });
    hitung();
  }
  if (lembar === 'Pemupukan' && $('#f_dosisKgPokok')) {
    var isiTotal = function () { var b = blokDariId($('#f_blokId').value), d = Number($('#f_dosisKgPokok').value); if (b && d && !$('#f_totalTon').value) $('#f_totalTon').placeholder = 'otomatis ±' + angka(d * (b.jumlahPokok || 0) / 1000, 2) + ' t'; };
    $('#f_dosisKgPokok').addEventListener('input', isiTotal); $('#f_blokId').addEventListener('change', isiTotal); isiTotal();
  }
  if ($('#fSimpan')) $('#fSimpan').onclick = function () {
    var data;
    try { data = ambilRuas(ruas); } catch (e) { toast(e.message, 'galat'); return; }
    if (lembar === 'Pemupukan' && (data.totalTon === null || data.totalTon === '')) { var b = blokDariId(data.blokId); if (b && data.dosisKgPokok) data.totalTon = Math.round(data.dosisKgPokok * (b.jumlahPokok || 0) / 10) / 100; }
    var baris = Object.assign({}, nilai, data);
    Object.keys(baris).forEach(function (k) { if (k.charAt(0) === '_' || k === 'dibuat' || k === 'diubah') delete baris[k]; });
    this.disabled = true;
    simpanBaris(lembar, baris).then(function (r) {
      if (!r.antri) toast(JUDUL_LEMBAR[lembar] + ' tersimpan.', 'ok');
      if (lembar === 'Blok' && typeof gambarLapisan === 'function') { _dem = null; }
      modalTutupLalu(function () { if (setelah) setelah(r); else gambarUlangTab(); });
    }).catch(function (e) { toast(e.message, 'galat'); var t = $('#fSimpan'); if (t) t.disabled = false; });
  };
  if ($('#fHapus')) $('#fHapus').onclick = function () {
    _modal.saatTutup = null;
    modalTutupLalu(function () {
      konfirmasi('Hapus ' + JUDUL_LEMBAR[lembar].toLowerCase() + '?', 'Data <b>' + esc(nilai.kode || nilai.nomorPokok || nilai.tanggal || nilai.id) + '</b> akan dihapus permanen (tercatat di audit).', 'Hapus', { bahaya: true }).then(function (ya) {
        if (!ya) return;
        hapusBaris(lembar, nilai.id).then(function () { toast('Dihapus.', 'ok'); if (setelah) setelah(); else gambarUlangTab(); })
          .catch(function (e) {
            if (e.kode === 'DIRUJUK') konfirmasi('Blok masih dirujuk', esc(e.message), 'Hapus juga', { bahaya: true, ketik: 'HAPUS ' + nilai.kode }).then(function (y2) { if (y2) hapusBaris(lembar, nilai.id, { paksa: true }).then(function () { toast('Dihapus.', 'ok'); gambarUlangTab(); }).catch(function (e2) { toast(e2.message, 'galat'); }); });
            else toast(e.message, 'galat');
          });
      });
    });
  };
}

function formBlok(b) {
  b = b || {};
  formCatatan('Blok', b, function () { if (PETA.peta) gambarLapisan(); gambarUlangTab(); });
  if (!$('#modalIsi')) return;
  var info = document.createElement('div');
  info.className = 'infoKotak';
  info.style.marginTop = '10px';
  var n = b.batas && b.batas[0] ? b.batas[0].length - 1 : 0;
  info.innerHTML = '<b>Batas poligon:</b> ' + (n ? n + ' titik • ' + angka(luasPoligonHa(b.batas), 2) + ' ha terhitung' : 'belum ada') +
    (bolehUbah('BLOCK_EDIT') ? ' • <a href="#" id="fTempel">tempel koordinat GeoJSON</a>' : '') + '<br><span class="kecilTeks">Untuk menggambar: Peta 2D ▸ 📏 Ukur ▸ Luas ▸ "Jadikan blok". Untuk berkas: Data Lapangan ▸ Impor.</span>';
  $('#modalIsi').appendChild(info);
  if ($('#fTempel')) $('#fTempel').onclick = function (e) {
    e.preventDefault();
    var teks = prompt('Tempel koordinat poligon GeoJSON, mis. [[[101.75,0.43],[101.76,0.43],[101.76,0.44],[101.75,0.43]]]');
    if (!teks) return;
    try {
      var j = JSON.parse(teks);
      if (j.type === 'Feature') j = j.geometry;
      if (j.type === 'Polygon') j = j.coordinates;
      if (j.type === 'MultiPolygon') j = j.coordinates[0];
      if (!Array.isArray(j[0][0])) j = [j];
      var c = j[0]; if (c[0][0] !== c[c.length - 1][0] || c[0][1] !== c[c.length - 1][1]) c.push(c[0]);
      b.batas = j;
      info.firstChild.nextSibling.textContent = ' ' + (c.length - 1) + ' titik • ' + angka(luasPoligonHa(j), 2) + ' ha (belum disimpan)';
      var tombol = $('#fSimpan');
      var asli = tombol.onclick;
      tombol.onclick = function () { $('#f_luasTanamHa').value = $('#f_luasTanamHa').value || ''; asli.call(tombol); };
      toast('Poligon diterima. Tekan Simpan.', 'ok');
    } catch (er) { toast('Koordinat tidak terbaca: ' + er.message, 'galat'); }
  };
}

function uraiGeojson(t) {
  var j = JSON.parse(t);
  if (j.crs && j.crs.properties && /3857|32[67]\d\d|23\d\d\d/.test(JSON.stringify(j.crs))) throw new Error('GeoJSON memakai proyeksi ' + JSON.stringify(j.crs.properties.name) + '. Ekspor ulang dalam WGS84 (EPSG:4326).');
  var fitur = j.type === 'FeatureCollection' ? j.features : j.type === 'Feature' ? [j] : [{ type: 'Feature', geometry: j, properties: {} }];
  return fitur.filter(function (f) { return f && f.geometry; });
}
function uraiKml(t) {
  var doc = new DOMParser().parseFromString(t, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('KML tidak terbaca (XML rusak).');
  var hasil = [];
  Array.prototype.forEach.call(doc.getElementsByTagName('Placemark'), function (pm) {
    var nama = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
    var props = { name: nama.trim() };
    Array.prototype.forEach.call(pm.getElementsByTagName('SimpleData'), function (sd) { props[sd.getAttribute('name')] = sd.textContent; });
    Array.prototype.forEach.call(pm.getElementsByTagName('Data'), function (sd) { var v = sd.getElementsByTagName('value')[0]; if (v) props[sd.getAttribute('name')] = v.textContent; });
    var koord = function (el) { return el.textContent.trim().split(/\s+/).map(function (s) { var p = s.split(','); return [Number(p[0]), Number(p[1])]; }).filter(function (p) { return isFinite(p[0]) && isFinite(p[1]); }); };
    var poli = pm.getElementsByTagName('Polygon')[0], garis = pm.getElementsByTagName('LineString')[0];
    if (poli) { var luar = poli.getElementsByTagName('outerBoundaryIs')[0]; var c = luar && luar.getElementsByTagName('coordinates')[0]; if (c) hasil.push({ type: 'Feature', properties: props, geometry: { type: 'Polygon', coordinates: [koord(c)] } }); }
    else if (garis) { var c2 = garis.getElementsByTagName('coordinates')[0]; if (c2) hasil.push({ type: 'Feature', properties: props, geometry: { type: 'LineString', coordinates: koord(c2) } }); }
  });
  return hasil;
}

function ambilProp(p, kunci) { for (var i = 0; i < kunci.length; i++) { var v = p[kunci[i]]; if (v !== undefined && v !== null && v !== '') return v; } return ''; }

function pratinjauImpor(fitur, tujuan) {
  var poligon = tujuan === 'Blok' || tujuan === 'Afdeling' || tujuan === 'Kebun';
  var baris = [], tolak = [], luarIndonesia = 0;
  fitur.forEach(function (f, i) {
    var g = f.geometry, p = f.properties || {};
    var kode = String(ambilProp(p, ['kode', 'KODE', 'Kode', 'blok', 'BLOK', 'Blok', 'block', 'BLOCK', 'name', 'Name', 'NAMA', 'nama']) || (tujuan.slice(0, 3).toUpperCase() + '-' + (i + 1))).trim();
    var geom;
    if (poligon) {
      if (g.type === 'Polygon') geom = g.coordinates; else if (g.type === 'MultiPolygon') geom = g.coordinates[0]; else { tolak.push(kode + ': bukan poligon'); return; }
      geom = geom.map(function (c) { c = c.map(function (q) { return [Number(Number(q[0]).toFixed(7)), Number(Number(q[1]).toFixed(7))]; }); if (c[0][0] !== c[c.length - 1][0] || c[0][1] !== c[c.length - 1][1]) c.push(c[0]); return c; });
    } else {
      if (g.type === 'LineString') geom = g.coordinates; else if (g.type === 'MultiLineString') geom = g.coordinates[0]; else { tolak.push(kode + ': bukan garis'); return; }
      geom = geom.map(function (q) { return [Number(Number(q[0]).toFixed(7)), Number(Number(q[1]).toFixed(7))]; });
    }
    var titik = poligon ? geom[0] : geom;
    if (titik.some(function (q) { return Math.abs(q[0]) > 180 || Math.abs(q[1]) > 90; })) { tolak.push(kode + ': koordinat bukan derajat (UTM?)'); return; }
    // Penanda (bukan penolakan): lintang-bujur tertukar atau .prj lupa - di luar kotak kasar Indonesia.
    if (titik.some(function (q) { return q[0] < 94 || q[0] > 142 || q[1] < -12 || q[1] > 7; })) luarIndonesia++;
    var b = { kode: kode, nama: String(ambilProp(p, ['nama', 'NAMA', 'name', 'Name']) || kode) };
    if (poligon) b.batas = geom; else b.garis = geom;
    if (tujuan === 'Blok') {
      var th = Number(ambilProp(p, ['tahun_tanam', 'TT', 'tahunTanam', 'TAHUN', 'tahun', 'planting_year']));
      if (th > 1950) b.tahunTanam = th;
      var ha = Number(ambilProp(p, ['luas', 'LUAS', 'luas_ha', 'area_ha', 'HA']));
      b.luasTanamHa = ha > 0 ? ha : Math.round(luasPoligonHa(geom) * 100) / 100;
      b.afdelingId = (afdelingAktif().filter(function (a) { return String(ambilProp(p, ['afdeling', 'AFD', 'divisi'])).toUpperCase().indexOf(String(a.kode).toUpperCase()) >= 0; })[0] || afdelingAktif()[0] || {}).id;
      b.sph = Number(ambilProp(p, ['sph', 'SPH'])) || 136;
      b.varietas = String(ambilProp(p, ['varietas', 'VARIETAS', 'variety']) || '');
    }
    if (tujuan === 'Jalan' || tujuan === 'Kanal') b.kebunId = S.kebunAktif || (kebunTerpilih()[0] || {}).id;
    if (tujuan === 'Afdeling' || tujuan === 'Kebun') { if (tujuan === 'Afdeling') b.kebunId = S.kebunAktif || (kebunTerpilih()[0] || {}).id; var ada = daftar(lembarKeKunci(tujuan)).filter(function (x) { return x.kode === kode; })[0]; if (ada) b.id = ada.id; }
    if (tujuan === 'Kebun' && kebunAktif() && fitur.length === 1) b.id = kebunAktif().id;
    baris.push(b);
  });
  var el = $('#imPratinjau');
  el.innerHTML = '<div class="infoKotak">' + baris.length + ' fitur siap diimpor sebagai ' + esc(tujuan) + (tolak.length ? ', ' + tolak.length + ' ditolak' : '') + '. Kode yang sudah ada akan DIPERBARUI.</div>' +
    (luarIndonesia ? '<div class="peringatanKotak" style="margin-top:6px">' + luarIndonesia + ' fitur berada di luar wilayah Indonesia - periksa apakah lintang/bujur tertukar atau berkas belum WGS84.</div>' : '') +
    (tolak.length ? '<div class="galatKotak" style="margin-top:6px">' + tolak.slice(0, 8).map(esc).join('<br>') + '</div>' : '') +
    '<div class="gulirX" style="max-height:240px;overflow:auto;margin-top:8px"><table class="tabel"><tr><th>Kode</th><th>Nama</th><th>' + (poligon ? 'Luas ha' : 'Panjang m') + '</th></tr>' + baris.slice(0, 200).map(function (b) {
      return '<tr><td>' + esc(b.kode) + '</td><td>' + esc(b.nama) + '</td><td class="mono">' + (poligon ? angka(luasPoligonHa(b.batas), 2) : angka(panjangGarisM(b.garis), 0)) + '</td></tr>';
    }).join('') + '</table></div>' + (baris.length ? '<button class="tbl utama" id="imKirim" style="margin-top:10px">Impor ' + baris.length + ' fitur</button>' : '');
  if ($('#imKirim')) $('#imKirim').onclick = function () {
    this.disabled = true; this.textContent = 'Mengimpor…';
    var potong = [], i;
    for (i = 0; i < baris.length; i += 200) potong.push(baris.slice(i, i + 200));
    var total = { baru: 0, diperbarui: 0, ditolak: [] };
    potong.reduce(function (p, bag) { return p.then(function () { return panggil('data_massal', { lembar: tujuan, baris: bag }, { batasMs: 120000 }).then(function (r) { total.baru += r.baru; total.diperbarui += r.diperbarui; total.ditolak = total.ditolak.concat(r.ditolak); }); }); }, Promise.resolve())
      .then(function () {

function imporCsvPanen(t) {
  var baris = t.replace(/^﻿/, '').split(/\r?\n/).filter(function (x) { return x.trim(); });
  if (baris.length < 2) { toast('CSV kosong.', 'galat'); return; }
  var pemisah = baris[0].indexOf(';') >= 0 ? ';' : ',';
  var judul = baris[0].split(pemisah).map(function (s) { return s.trim().toLowerCase().replace(/"/g, ''); });
  var i = function (n) { return judul.indexOf(n); };
  if (i('kode_blok') < 0 || i('tanggal') < 0 || i('berat_kg') < 0) { toast('Kolom wajib: kode_blok, tanggal, berat_kg (janjang disarankan).', 'galat', 6000); return; }
  var peta = {}; blokAktif().forEach(function (b) { peta[String(b.kode).toLowerCase()] = b.id; });
  var hasil = [], salah = [];
  baris.slice(1).forEach(function (r, n) {
    var c = r.split(pemisah).map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
    var num = function (k) { var v = i(k) >= 0 ? c[i(k)] : ''; if (v === '' || v === undefined) return null; v = pemisah === ';' ? v.replace(/\./g, '').replace(',', '.') : v; return Number(v); };
    var blok = peta[String(c[i('kode_blok')]).toLowerCase()];
    var tg = c[i('tanggal')];
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(tg)) tg = tg.slice(6) + '-' + tg.slice(3, 5) + '-' + tg.slice(0, 2);
    if (!blok) { salah.push('baris ' + (n + 2) + ': blok "' + c[i('kode_blok')] + '" tidak dikenal'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tg)) { salah.push('baris ' + (n + 2) + ': tanggal "' + tg + '"'); return; }
    hasil.push({ blokId: blok, tanggal: tg, janjang: num('janjang') || 0, beratKg: num('berat_kg'), rotasi: num('rotasi'), pemanen: num('pemanen'), brondolanKg: num('brondolan_kg') });
  });
  var el = $('#imCsvHasil');
  el.innerHTML = '<div class="infoKotak">' + hasil.length + ' baris valid • total ' + angka(hasil.reduce(function (a, b) { return a + (b.beratKg || 0); }, 0) / 1000, 1) + ' ton' + (salah.length ? ' • ' + salah.length + ' baris dilewati' : '') + '</div>' +
    (salah.length ? '<div class="galatKotak" style="margin-top:6px">' + salah.slice(0, 10).map(esc).join('<br>') + '</div>' : '') + (hasil.length ? '<button class="tbl utama" id="imCsvKirim" style="margin-top:8px">Impor ' + hasil.length + ' catatan panen</button>' : '');
  if ($('#imCsvKirim')) $('#imCsvKirim').onclick = function () {
    this.disabled = true;
    panggil('data_massal', { lembar: 'Panen', baris: hasil }, { batasMs: 120000 }).then(function (r) { toast(r.baru + ' catatan panen diimpor' + (r.ditolak.length ? ', ' + r.ditolak.length + ' ditolak' : ''), 'ok'); DASBOR.rekap = null; el.innerHTML = ''; })
      .catch(function (e) { toast(e.message, 'galat'); });
  };
}

  if (!k || !(b.demTersedia || []).some(function (x) { return x === k; })) { Simpan.hapus('sgh_dem'); return Promise.resolve(); }
  var simpan = Simpan.ambil('sgh_dem', null);
  if (simpan && simpan.kebunId === k && simpan._v === b.waktuPeladen.slice(0, 10)) { window._demImpor = demDariPaket(simpan); return Promise.resolve(); }
  return panggil('dem_ambil', { kebunId: k }).then(function (d) {
    if (!d) return;
    d.kebunId = k; d._v = b.waktuPeladen.slice(0, 10);
    Simpan.taruh('sgh_dem', d);
    window._demImpor = demDariPaket(d);
  }).catch(function () { });
}

function pasangServiceWorker() {
  // Hanya versi GitHub Pages yang membawa manifest + sw.js (Apps Script & demo satu berkas tidak).
  if (S.mode === 'gas' || !document.querySelector('link[rel=manifest]')) return;
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    reg.addEventListener('updatefound', function () {
      var baru = reg.installing;
      if (!baru) return;
      baru.addEventListener('statechange', function () {
        if (baru.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru tersedia - tutup & buka ulang aplikasi untuk memakainya.', 'ok', 8000);
      });
    });
  }).catch(function (e) { console.warn('SW gagal:', e); });
}

(function mulai() {
  S.mode = tentukanMode();
  muatAntrian();
  aturTataLetak();
  $('#tblProfil').onclick = bukaMenuProfil;
  pasangServiceWorker();
  if (S.mode === 'belum') {
    $('#layarMasuk').classList.remove('sembunyi');
    $('#layarMasuk').innerHTML = '<div class="kotakMasuk"><h2>Belum terhubung ke peladen</h2><p>Isi <span class="mono">GAS_URL</span> di berkas <b>config.js</b> dengan URL Web App Apps Script Anda (berakhiran <span class="mono">/exec</span>), lalu unggah ulang ke GitHub Pages.</p>' +
      '<pre class="mono" style="white-space:pre-wrap;background:#050b18;padding:10px;border-radius:10px;font-size:12px">window.SAWITGIS_KONFIG = {\n  GAS_URL: \'https://script.google.com/macros/s/XXXX/exec\'\n};</pre><p class="redup kecilTeks">Panduan lengkap: PANDUAN.pdf bab 4.</p></div>';
    return;
  }
  S.token = Simpan.ambil(KUNCI.token, null);
  if (S.token) mulaiAplikasi(); else tampilkanMasuk();
  // Info publik (judul/logo) untuk layar masuk berikutnya.
  if (!S.token) panggil('info_publik', {}, { tanpaToken: true }).then(function (i) { Simpan.taruh('sgh_info_publik', i); perbaruiKepalaMasuk(i); }).catch(function () { });
})();

</script>
